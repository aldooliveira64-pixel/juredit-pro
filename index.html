            </div>
            {/* Exportação rápida */}
            <div style={{display:"flex",gap:7}}>
              <button onClick={()=>exportarTratadoCompleto(capitulos,p)} style={{padding:"9px 16px",background:"#8b1a1a",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>⬇ .docx Completo</button>
              <button onClick={()=>exportarTratadoPDF(capitulos,p)} style={{padding:"9px 16px",background:"#0f1a33",color:G,border:`1px solid ${G}`,borderRadius:6,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>⬇ PDF</button>
            </div>
          </div>

          {/* ── 5.7 NOTA DE QUALIDADE ACADÊMICA ── */}
          <div style={{background:CARD,border:`2px solid ${notaAtual.cor||BORDER}`,borderRadius:12,padding:"16px 20px",marginBottom:16,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,bottom:0,width:4,background:notaAtual.cor||BORDER}}/>
            <div style={{display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
              {/* Gauge */}
              <div style={{textAlign:"center",flexShrink:0}}>
                <div style={{fontSize:52,fontWeight:900,color:notaAtual.cor||N,lineHeight:1,fontFamily:"monospace"}}>{notaAtual.total}</div>
                <div style={{fontSize:12,color:TEXT2}}>/100</div>
                <div style={{fontSize:11,fontWeight:700,color:notaAtual.cor||N,marginTop:4}}>{notaAtual.nivel||"—"}</div>
              </div>
              {/* Barra circular via SVG simples */}
              <svg width="80" height="80" style={{flexShrink:0}}>
                <circle cx="40" cy="40" r="32" fill="none" stroke={BORDER} strokeWidth="8"/>
                <circle cx="40" cy="40" r="32" fill="none" stroke={notaAtual.cor||G} strokeWidth="8"
                  strokeDasharray={`${(notaAtual.total/100)*201} 201`}
                  strokeLinecap="round" transform="rotate(-90 40 40)" style={{transition:"stroke-dasharray .8s"}}/>
              </svg>
              {/* Breakdown */}
              <div style={{flex:1,minWidth:200}}>
                <div style={{fontSize:11,fontWeight:700,color:N,marginBottom:8}}>Nota de Qualidade Acadêmica</div>
                {notaAtual.detalhe&&[
                  {l:"Capítulos concluídos (≥90%)",v:notaAtual.detalhe.pCaps,max:40,info:`${notaAtual.detalhe.conc||0} de ${capitulos.length}`},
                  {l:"Fontes doutrinárias aprovadas",v:notaAtual.detalhe.pFontes,max:30,info:`${Object.values(fontesAprovadas).filter(Boolean).length} de ${fontesUnicas.length}`},
                  {l:"Notas de rodapé (≥25/cap.)",v:notaAtual.detalhe.pNotas,max:20,info:`${notaAtual.detalhe.notas||0} total`},
                  {l:"Ausência de erros ABNT",v:notaAtual.detalhe.pErros,max:10,info:`${errosABNT.length} erro(s)`},
                ].map((item,i)=>(
                  <div key={i} style={{marginBottom:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                      <span style={{fontSize:9,color:TEXT2}}>{item.l}</span>
                      <span style={{fontSize:9,fontFamily:"monospace",color:N,fontWeight:700}}>{item.v}/{item.max} pts <span style={{color:TEXT2,fontWeight:400}}>({item.info})</span></span>
                    </div>
                    <div style={{height:4,background:BORDER,borderRadius:2,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${(item.v/item.max)*100}%`,background:notaAtual.cor||G,borderRadius:2,transition:"width .6s"}}/>
                    </div>
                  </div>
                ))}
              </div>
              {/* Botão recalcular */}
              <button onClick={rodarValidacaoABNT} style={{padding:"8px 14px",background:"transparent",border:`1px solid ${G}`,color:G,borderRadius:6,cursor:"pointer",fontSize:10,fontFamily:"monospace",fontWeight:700,alignSelf:"flex-start"}}>🔄 Recalcular</button>
            </div>
          </div>

          {/* ── 5.2 VALIDADOR ABNT ── */}
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:N}}>📐 Validador ABNT NBR 6023:2018</div>
                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace",marginTop:2}}>Verifica formato das notas, sequência de numeração, anos, referências curtas</div>
              </div>
              <button onClick={rodarValidacaoABNT} disabled={validandoABNT||!capitulos.some(c=>c.texto)}
                style={{padding:"7px 16px",background:validandoABNT?(darkMode?"#1e2d45":"#d4cfc6"):(darkMode?"#1a2744":"#0f1a33"),color:validandoABNT?TEXT2:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
                {validandoABNT?<><div style={{width:10,height:10,borderRadius:"50%",border:`2px solid ${G}`,borderTopColor:"transparent",animation:"spin 1s linear infinite"}}/>Validando…</>:"📐 Validar ABNT"}
              </button>
            </div>
            {errosABNT.length===0&&!validandoABNT&&(
              <div style={{fontSize:11,color:"#16a34a",fontFamily:"monospace",padding:"10px 14px",background:"rgba(22,163,74,.07)",borderRadius:6,border:"1px solid rgba(22,163,74,.2)"}}>✅ {capitulos.some(c=>c.texto)?"Nenhum erro ABNT detectado. Clique em Validar ABNT para rodar a análise.":"Adicione capítulos com conteúdo para validar."}</div>
            )}
            {errosABNT.length>0&&(
              <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:280,overflowY:"auto"}}>
                {["alta","media","baixa"].map(grav=>{
                  const errosG = errosABNT.filter(e=>e.gravidade===grav);
                  if(!errosG.length) return null;
                  const corG = grav==="alta"?"#b91c1c":grav==="media"?"#b45309":"#0369a1";
                  return (<div key={grav}>
                    <div style={{fontSize:8,color:corG,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".08em",marginBottom:4,marginTop:6}}>{grav==="alta"?"🔴 Crítico":grav==="media"?"🟡 Médio":"🔵 Leve"} — {errosG.length} ocorrência{errosG.length!==1?"s":""}</div>
                    {errosG.map((e,i)=>(
                      <div key={i} style={{padding:"8px 12px",background:`${corG}08`,border:`1px solid ${corG}25`,borderRadius:6,marginBottom:5}}>
                        <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                          <span style={{fontSize:9,padding:"1px 6px",background:`${corG}15`,color:corG,borderRadius:3,fontFamily:"monospace",whiteSpace:"nowrap"}}>Cap. {e.cap}{e.linha>0?` · L${e.linha}`:""}</span>
                          <div>
                            <div style={{fontSize:11,color:N,fontWeight:700,marginBottom:2}}>{e.tipo}: {e.msg}</div>
                            <div style={{fontSize:10,color:TEXT2}}>💡 {e.sugestao}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>);
                })}
              </div>
            )}
          </div>

          {/* ── 5.3 VALIDADOR DE PROCESSOS ── */}
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:N}}>🔍 Validador de Processos Judiciais</div>
                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace",marginTop:2}}>Extrai todos os números de processo e avalia plausibilidade via IA</div>
              </div>
              <button onClick={rodarValidacaoProc} disabled={validandoProc||!capitulos.some(c=>c.texto)}
                style={{padding:"7px 16px",background:validandoProc?(darkMode?"#1e2d45":"#d4cfc6"):(darkMode?"#1a2744":"#0f1a33"),color:validandoProc?TEXT2:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
                {validandoProc?<><div style={{width:10,height:10,borderRadius:"50%",border:`2px solid ${G}`,borderTopColor:"transparent",animation:"spin 1s linear infinite"}}/>Verificando…</>:"🔍 Verificar Processos"}
              </button>
            </div>
            {/* Processos extraídos preview */}
            {!validandoProc&&resultadosProc.length===0&&(
              <div style={{fontSize:10,color:TEXT2,fontFamily:"monospace",padding:"8px 0"}}>
                {capitulos.some(c=>c.texto)
                  ? `Processos encontrados nos capítulos: ${[...new Set(capitulos.flatMap(c=>extrairProcessos(c.texto||"")))].slice(0,8).join(", ")||"nenhum detectado"}. Clique em Verificar para analisar.`
                  : "Adicione capítulos com conteúdo para verificar processos."}
              </div>
            )}
            {resultadosProc.length>0&&(
              <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:240,overflowY:"auto"}}>
                {resultadosProc.map((r,i)=>{
                  const cor=r.plausivel===true?"#16a34a":r.plausivel===false?"#b91c1c":"#b45309";
                  const ic=r.plausivel===true?"✅":r.plausivel===false?"❌":"⚠️";
                  return(
                    <div key={i} style={{padding:"8px 12px",background:`${cor}08`,border:`1px solid ${cor}25`,borderRadius:6,display:"flex",gap:10,alignItems:"flex-start"}}>
                      <span style={{fontSize:14,flexShrink:0}}>{ic}</span>
                      <div>
                        <div style={{fontSize:11,fontWeight:700,color:N,fontFamily:"monospace"}}>{r.numero}</div>
                        <div style={{fontSize:9,color:TEXT2}}>{r.tribunal&&`${r.tribunal} · `}{r.motivo}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* ── 5.6 DASHBOARD DE FONTES ── */}
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:N}}>📋 Dashboard de Fontes — Aprovação Manual</div>
                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace",marginTop:2}}>{fontesUnicas.length} fonte{fontesUnicas.length!==1?"s":""} importada{fontesUnicas.length!==1?"s":""} · {Object.values(fontesAprovadas).filter(Boolean).length} aprovada{Object.values(fontesAprovadas).filter(Boolean).length!==1?"s":""}</div>
              </div>
              {fontesUnicas.length>0&&(
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>{const fa={};fontesUnicas.forEach(f=>fa[f.id]=true);setFontesAprovadas(fa);setToast("✅ Todas as fontes aprovadas");}} style={{padding:"5px 12px",background:"rgba(22,163,74,.1)",border:"1px solid rgba(22,163,74,.3)",color:"#16a34a",borderRadius:4,cursor:"pointer",fontSize:10,fontFamily:"monospace"}}>✓ Aprovar todas</button>
                  <button onClick={()=>hCopy(abntGerarListaReferencias(fontesUnicas.filter(f=>fontesAprovadas[f.id])),"refs5")} style={{padding:"5px 12px",background:"transparent",border:`1px solid ${BORDER}`,color:TEXT2,borderRadius:4,cursor:"pointer",fontSize:10,fontFamily:"monospace"}}>{cpFb["refs5"]?"✓ Copiado!":"📋 Copiar ABNT"}</button>
                </div>
              )}
            </div>
            {fontesUnicas.length===0?(
              <div style={{fontSize:11,color:TEXT2,fontFamily:"monospace",padding:"10px 0"}}>Nenhuma fonte importada. Use 📚 Importar Doutrina no Editor ou na aba Capítulos.</div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:300,overflowY:"auto"}}>
                {fontesUnicas.map(f=>{
                  const aprov=!!fontesAprovadas[f.id];
                  const cor=TIPO_COR_DOC[f.tipo]||"#64748b";
                  return(
                    <div key={f.id} onClick={()=>toggleFonteAprov(f.id)}
                      style={{display:"flex",gap:10,padding:"9px 12px",border:`2px solid ${aprov?cor:BORDER}`,borderRadius:7,background:aprov?`${cor}07`:CARD,cursor:"pointer",transition:"all .13s",alignItems:"flex-start"}}>
                      <input type="checkbox" checked={aprov} onChange={()=>toggleFonteAprov(f.id)} onClick={e=>e.stopPropagation()} style={{marginTop:2,accentColor:cor,flexShrink:0}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:11,fontWeight:aprov?700:400,color:N,marginBottom:2}}>{f.titulo?.slice(0,80)}{f.titulo?.length>80?"…":""}</div>
                        <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace"}}>{f.autor} {f.ano&&`· ${f.ano}`} · Cap. {f._capNum}</div>
                        <div style={{fontSize:9,color:TEXT2,marginTop:3,fontStyle:"italic"}}>{f.notaRodape?.slice(0,80)}{f.notaRodape?.length>80?"…":""}</div>

                <div style={{fontSize:10,color:TEXT2,lineHeight:1.6,marginBottom:12}}>Abre janela de impressão formatada para A4 · Times New Roman · margens ABNT · referências ao final · compatível com impressão e salvar como PDF</div>

                <button onClick={()=>exportarTratadoPDF(capitulos,p)} disabled={!capitulos.some(c=>c.texto)}
                  style={{width:"100%",padding:"9px",background:capitulos.some(c=>c.texto)?(darkMode?"#1a2744":"#0f1a33"):"#d4cfc6",color:capitulos.some(c=>c.texto)?G:"#9ca3af",border:`1px solid ${capitulos.some(c=>c.texto)?G:"#d4cfc6"}`,borderRadius:5,cursor:capitulos.some(c=>c.texto)?"pointer":"not-allowed",fontSize:12,fontFamily:"monospace",fontWeight:700}}>⬇ Exportar PDF</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ══════════ TEMPLATES ══════════ */}
      {tab==="templates"&&(

            <div key={grupo.g} style={{marginBottom:20}}>

              </div>

                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace",marginBottom:5}}>

              </div>
            )}
            <div style={{display:"flex",gap:8,alignItems:"center"}}>

            </div>

                      </div>
                    </div>
                    <div style={{fontSize:10,color:TEXT2,lineHeight:1.6,marginBottom:10}}>{item.desc}</div>
                    <div style={{display:"flex",gap:5}}>
                      <button className="abrir-btn" onClick={()=>window.open(item.url,"_blank")}
                        style={{flex:1,padding:"5px 8px",border:`1px solid ${BORDER}`,background:"transparent",color:N,borderRadius:4,cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:700,transition:"all .15s"}}>🌐 Abrir</button>

                        style={{flex:1,padding:"5px 8px",border:`1px solid ${grp.cor}50`,background:`${grp.cor}08`,color:grp.cor,borderRadius:4,cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:700,transition:"all .15s",opacity:biblioSearchTerm?1:.5}}>🔍 Buscar</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {/* Fontes Salvas */}
          {fontesSalvas.length>0&&(
            <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"14px 16px",marginTop:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:N}}>📌 Fontes Salvas ({fontesSalvas.length})</div>

                        <button onClick={()=>setFontesSalvas(fs=>fs.filter(x=>x.id!==f.id))} style={{padding:"2px 6px",border:"none",background:"transparent",color:"#b91c1c",cursor:"pointer",fontSize:11}}>✕</button>
                      </div>
                    </div>
                    <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",marginTop:4}}>{f.area} · {new Date(f.ts).toLocaleString("pt-BR")}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{background:darkMode?"rgba(201,168,76,.04)":"rgba(201,168,76,.06)",border:`1px solid ${G}25`,borderRadius:8,padding:"12px 16px",marginTop:16,display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{fontSize:18,flexShrink:0}}>💡</span>

          <div style={{display:"flex",gap:7,marginBottom:12}}>
            <input value={bTermo} onChange={e=>setBTermo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")buscar();}}

            <button onClick={buscar} disabled={bLoad||!bTermo}
              style={{padding:"9px 18px",background:bLoad||!bTermo?(darkMode?"#1e2d45":"#d4cfc6"):(darkMode?"#1a2744":"#0f1a33"),color:"white",border:"none",borderRadius:5,cursor:bLoad||!bTermo?"not-allowed":"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>
              {bLoad?"⏳...":motor==="claude"?"⚖️ Claude":"🔮 Gemini"}
            </button>
          </div>
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"11px 15px",marginBottom:14}}>
            <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".09em",marginBottom:8}}>Abrir diretamente no tribunal:</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {TRIBUNAIS.map(t=>(
                <button key={t.l} className="tb" onClick={()=>bTermo&&window.open(t.url+encodeURIComponent(bTermo),"_blank")} disabled={!bTermo}
                  style={{padding:"5px 11px",border:`1px solid ${N}`,borderRadius:4,background:CARD,color:N,cursor:bTermo?"pointer":"not-allowed",fontSize:10,fontFamily:"monospace",fontWeight:700,opacity:bTermo?1:.3,transition:"all .13s"}}>
                  🔗 {t.l}
                </button>
              ))}
            </div>
          </div>
          {bResult&&(
            <div style={{background:CARD,border:`1px solid ${G}50`,borderLeft:`3px solid ${G}`,borderRadius:4,padding:"14px 18px"}}>
              <div style={{fontSize:8,color:G,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>Jurisprudência compilada — Claude Sonnet 4</div>
              <div style={{fontSize:13,lineHeight:1.9,fontFamily:"Georgia,serif"}}><Linhas text={bResult} dark={darkMode}/></div>
              <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
                <button onClick={()=>hCopy(bResult,"b")} style={bOut(cpFb["b"]?"#22c55e":BORDER,cpFb["b"]?"#166534":TEXT2)}>{cpFb["b"]?"✓ Copiado!":"📋 Copiar"}</button>
                <button onClick={()=>exportarMarkdown(bResult,bTermo)} style={bOut(G,G)}>⬇ .md</button>
                <button onClick={()=>{setTema(`Desenvolva texto jurídico completo usando estas jurisprudências:\n\nTema: ${bTermo}`);setProblema(bResult.slice(0,500));setTab("editor");}} style={{padding:"5px 13px",background:darkMode?"#1a2744":"#0f1a33",color:"white",border:"none",borderRadius:4,fontSize:11,fontFamily:"monospace",cursor:"pointer",fontWeight:700}}>✍️ Usar no Editor →</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ══════════ PROJETO ══════════ */}
      {tab==="projeto"&&(
        <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
          <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".13em",marginBottom:14}}>Configuração do projeto editorial</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
            {[{l:"📖 Nome do livro / tratado",k:"nome",ph:"Ex: Direito Administrativo Contemporâneo — 3ª Edição"},
              {l:"🏛 Área do Direito",k:"area",ph:"Ex: Direito Administrativo, Constitucional..."}].map(f=>(
              <div key={f.k}>
                <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>{f.l}</label>
                <input value={p[f.k]||""} onChange={e=>setProj(pr=>({...pr,[f.k]:e.target.value}))} placeholder={f.ph}
                  style={{width:"100%",padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:12,outline:"none",background:CARD,color:N}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
              </div>
            ))}
          </div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>✍️ Autores / referência de estilo</label>
            <input value={p.autores||""} onChange={e=>setProj(pr=>({...pr,autores:e.target.value}))}
              placeholder="Ex: Celso Antônio Bandeira de Mello, Di Pietro, Marinoni..."
              style={{width:"100%",padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:12,outline:"none",background:CARD,color:N}}
              onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div>
              <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>✅ Capítulos concluídos (um por linha)</label>
              <textarea value={(p.capsOk||[]).join("\n")} onChange={e=>setProj(pr=>({...pr,capsOk:e.target.value.split("\n").map(l=>l.trim()).filter(Boolean)}))}
                placeholder={"Cap. 1 — Fundamentos\nCap. 2 — Princípios Constitucionais"}
                style={{width:"100%",minHeight:120,padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:11,outline:"none",resize:"vertical",lineHeight:1.7,background:CARD,color:N}}/>
            </div>
            <div>
              <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>⏳ Próximos capítulos (número|título)</label>
              <textarea value={(p.capsProx||[]).map(c=>`${c.num}|${c.titulo}`).join("\n")}
                onChange={e=>setProj(pr=>({...pr,capsProx:e.target.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [n,...r]=l.split("|");return{num:n.trim(),titulo:r.join("|").trim()};}).filter(c=>c.num&&c.titulo)}))}
                placeholder={"3|Licitação — Lei 14.133/2021\n4|Contratos Administrativos"}
                style={{width:"100%",minHeight:120,padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:11,outline:"none",resize:"vertical",lineHeight:1.7,background:CARD,color:N}}/>
            </div>
          </div>
          {totalC>0&&(
            <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"12px 16px",marginTop:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
                <span style={{fontSize:11,fontFamily:"monospace",color:N}}>Progresso do tratado</span>
                <span style={{fontSize:12,fontFamily:"monospace",color:G,fontWeight:700}}>{p.capsOk?.length||0}/{totalC} ({pct}%)</span>
              </div>
              <div style={{height:5,background:BORDER,borderRadius:3,overflow:"hidden",marginBottom:9}}>
                <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#4ade80,#16a34a)",borderRadius:3,transition:"width .6s"}}/>
              </div>
            </div>
          )}
          {/* Fontes importadas no capítulo */}
          {capituloAtivo.doutrina.length>0&&(
            <div style={{background:CARD,border:`1px solid #7c3aed40`,borderRadius:8,padding:"12px 16px",marginTop:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:N}}>📚 Doutrina importada — {capituloAtivo.doutrina.length} fonte{capituloAtivo.doutrina.length!==1?"s":""}</div>
                <button onClick={()=>{if(window.confirm("Limpar todas as fontes importadas?"))setCapituloAtivo({titulo:"Capítulo ativo",doutrina:[]});}} style={{fontSize:9,padding:"3px 8px",border:"1px solid #fca5a5",background:"transparent",color:"#b91c1c",borderRadius:3,cursor:"pointer",fontFamily:"monospace"}}>🗑 Limpar</button>
              </div>
              <div style={{fontSize:11,color:TEXT2,lineHeight:1.8,fontFamily:"monospace",whiteSpace:"pre-wrap",maxHeight:200,overflowY:"auto",fontSize:10}}>
                {gerarBlocoRefDoutrina(capituloAtivo.doutrina)}
              </div>
              <button onClick={()=>hCopy(gerarBlocoRefDoutrina(capituloAtivo.doutrina),"refbloco")} style={{marginTop:8,...bOut(cpFb["refbloco"]?"#22c55e":BORDER,cpFb["refbloco"]?"#166534":TEXT2)}}>{cpFb["refbloco"]?"✓ Copiado!":"📋 Copiar Referências ABNT"}</button>
            </div>
          )}
          <div style={{display:"flex",gap:7,marginTop:16}}>
            <button onClick={()=>{setTipo("sumario");setTema(p.nome||"Tratado Jurídico");setTab("editor");}}
              style={{padding:"7px 16px",background:darkMode?"#1a2744":"#0f1a33",color:G,border:`1px solid ${G}`,borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"monospace",fontWeight:700}}>📋 Gerar Sumário</button>
            <button onClick={()=>{if(window.confirm("Limpar todo o projeto?"))setProj({});}}
              style={{padding:"7px 14px",background:CARD,color:"#b91c1c",border:"1px solid #fca5a5",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"monospace"}}>🗑 Limpar</button>
          </div>
        </div>
      )}

      <Toast msg={toast} onClose={()=>setToast("")}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
