// ══════════════════════════════════════════════
// ZIP + DOCX ENGINE
// ══════════════════════════════════════════════
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let j = 0; j < 8; j++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c; }
  return t;
})();
const crc32 = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC_TABLE[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const s2u = s => new TextEncoder().encode(s);
const cat = a => { const t = a.reduce((s, x) => s + x.length, 0), o = new Uint8Array(t); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
const u16 = (b, o, v) => { b[o] = v & 0xFF; b[o + 1] = (v >> 8) & 0xFF; };
const u32 = (b, o, v) => { b[o] = v & 0xFF; b[o + 1] = (v >> 8) & 0xFF; b[o + 2] = (v >> 16) & 0xFF; b[o + 3] = (v >> 24) & 0xFF; };

function buildZip(files) {
  const lp = [], cd = []; let off = 0;
  for (const f of files) {
    const nm = s2u(f.name), dt = f.data, cr = crc32(dt), sz = dt.length;
    const lh = new Uint8Array(30 + nm.length);
    u32(lh, 0, 0x04034b50); u16(lh, 4, 20); u32(lh, 14, cr); u32(lh, 18, sz); u32(lh, 22, sz); u16(lh, 26, nm.length); lh.set(nm, 30);
    const ce = new Uint8Array(46 + nm.length);
    u32(ce, 0, 0x02014b50); u16(ce, 4, 20); u16(ce, 6, 20); u32(ce, 16, cr); u32(ce, 20, sz); u32(ce, 24, sz); u16(ce, 28, nm.length); u32(ce, 42, off); ce.set(nm, 46);
    lp.push(lh, dt); cd.push(ce); off += lh.length + sz;
  }
  const cdd = cat(cd), eo = new Uint8Array(22);
  u32(eo, 0, 0x06054b50); u16(eo, 8, files.length); u16(eo, 10, files.length); u32(eo, 12, cdd.length); u32(eo, 16, off);
  return cat([...lp, cdd, eo]);
}

const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const FONT = `<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>`;

function wRun(r, pt = 12) {
  const sz = pt * 2;
  const rpr = [r.bold ? "<w:b/><w:bCs/>" : "", r.italic ? "<w:i/><w:iCs/>" : "", FONT, `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`].join("");
  return `<w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${esc(r.text)}</w:t></w:r>`;
}
function wPara(runs, o = {}) {
  const al = o.center ? "center" : (o.align || "both");
  let ind = o.indent ? `<w:ind w:firstLine="${o.indent}"/>` : o.indL ? `<w:ind w:left="${o.indL}" w:right="${o.indR || 0}"/>` : "";
  const ppr = `<w:pPr><w:spacing w:before="${o.sb || 0}" w:after="${o.sa || 60}" w:line="${o.lv || 276}" w:lineRule="auto"/>${ind}<w:jc w:val="${al}"/></w:pPr>`;
  return `<w:p>${ppr}${runs.map(r => wRun(r, o.pt || 12)).join("")}</w:p>`;
}
const emptyP = () => `<w:p><w:pPr><w:spacing w:before="0" w:after="60"/></w:pPr></w:p>`;

function parseInline(str) {
  const out = [], re = /(\*\*[^*]+\*\*|\*[^*]+\*)/g; let last = 0, m;
  str = str.replace(/\[Fonte:[^\]]+\]/g, "");
  while ((m = re.exec(str)) !== null) {
    if (m.index > last) out.push({ text: str.slice(last, m.index), bold: false, italic: false });
    const tok = m[0];
    if (/^\*\*/.test(tok)) out.push({ text: tok.slice(2, -2), bold: true, italic: false });
    else out.push({ text: tok.slice(1, -1), bold: false, italic: true });
    last = m.index + tok.length;
  }
  if (last < str.length) out.push({ text: str.slice(last), bold: false, italic: false });
  return out.filter(r => r.text);
}

async function gerarDocx(rawText, nomeLivro, proj) {
  const lines = rawText.split("\n");
  const ni = lines.findIndex(l => /^②\s*NOTAS/i.test(l.trim()));
  const body = ni > -1 ? lines.slice(0, ni) : lines;
  const notes = ni > -1 ? lines.slice(ni + 1) : [];
  const fnMap = {};
  for (const ln of notes) {
    const raw = ln.trim(); if (!raw) continue;
    const m = raw.match(/^([⁰¹²³⁴⁵⁶⁷⁸⁹]+|\d{1,2})[.\)\s]\s*(.+)/);
    if (m) { const n = parseInt(m[1]) || [...m[1]].reduce((a, c) => a * 10 + "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c), 0); if (n > 0) fnMap[n] = m[2]; }
  }
  const paras = [emptyP(), emptyP()];
  if (proj?.nome) {
    paras.push(wPara([{ text: proj.nome, bold: true, italic: false }], { center: true, pt: 20, sb: 60, sa: 120, lv: 280 }));
    if (proj.area) paras.push(wPara([{ text: proj.area, bold: false, italic: true }], { center: true, pt: 11, sa: 80, lv: 240 }));
    paras.push(emptyP(), emptyP());
  }
  for (const line of body) {
    const raw = line.trim();
    if (!raw) { paras.push(emptyP()); continue; }
    if (/^-{3,}$/.test(raw)) { paras.push(`<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="4" w:color="888888"/></w:pBdr><w:spacing w:before="120" w:after="120"/></w:pPr></w:p>`); continue; }
    if (/^EMENTA_CAP:/i.test(raw)) { paras.push(wPara([{ text: raw.replace(/^EMENTA_CAP:\s*/i, ""), bold: false, italic: true }], { align: "both", pt: 10, sa: 0, lv: 240, indL: 1440, indR: 1440 })); continue; }
    if (raw === raw.toUpperCase() && /[A-ZÁÉÍÓÚ]{4,}/.test(raw) && raw.length > 4 && !/^\d/.test(raw) && !/^[①②③]/.test(raw)) { paras.push(wPara([{ text: raw, bold: true, italic: false }], { center: true, pt: 14, sb: 0, sa: 360, lv: 240 })); continue; }
    if (/^\*\*[^*]+\*\*$/.test(raw)) { paras.push(wPara([{ text: raw.replace(/\*\*/g, ""), bold: true, italic: false }], { align: "left", pt: 12, sb: 420, sa: 180, lv: 276 })); continue; }
    if (/^#{1,3}\s/.test(raw)) { paras.push(wPara([{ text: raw.replace(/^#+\s/, ""), bold: true, italic: false }], { align: "left", pt: 12, sb: 420, sa: 180, lv: 276 })); continue; }
    if (/^>\s*/.test(raw)) { paras.push(wPara(parseInline(raw.replace(/^>\s*/, "")), { align: "both", pt: 9, sb: 120, sa: 120, lv: 240, indL: 709, indR: 709 })); continue; }
    if (/^[①②③④⑤]/.test(raw) || /^(NOTAS?\s*DE\s*RODAP|REFERÊNCIAS|AVALIAÇÃO)/i.test(raw)) continue;
    paras.push(wPara(parseInline(raw), { align: "both", pt: 12, indent: 709, sb: 0, sa: 60, lv: 276 }));
  }
  const hTxt = esc((nomeLivro || "JurEditPro").slice(0, 80));
  const fnEntries = Object.entries(fnMap).sort((a, b) => Number(a[0]) - Number(b[0]));
  const footnotesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:footnotes xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:footnote w:type="separator" w:id="-1"><w:p><w:r><w:separator/></w:r></w:p></w:footnote><w:footnote w:type="continuationSeparator" w:id="0"><w:p><w:r><w:continuationSeparator/></w:r></w:p></w:footnote>${fnEntries.map(([id, text]) => `<w:footnote w:id="${id}"><w:p><w:pPr><w:jc w:val="both"/></w:pPr><w:r><w:rPr><w:rStyle w:val="FootnoteReference"/></w:rPr><w:footnoteRef/></w:r><w:r><w:rPr>${FONT}<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve"> ${esc(text)}</w:t></w:r></w:p></w:footnote>`).join("")}</w:footnotes>`;
  const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${paras.join("")}<w:sectPr><w:headerReference w:type="default" r:id="rH1"/><w:footerReference w:type="default" r:id="rF1"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1800" w:right="1800" w:bottom="1800" w:left="1800" w:header="708" w:footer="708"/></w:sectPr></w:body></w:document>`;
  const headerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="right"/><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="4" w:color="888888"/></w:pBdr></w:pPr><w:r><w:rPr><w:i/><w:sz w:val="16"/><w:szCs w:val="16"/>${FONT}</w:rPr><w:t>${hTxt}</w:t></w:r></w:p></w:hdr>`;
  const footerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText> PAGE </w:instrText></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;
  const rD = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footnotes" Target="footnotes.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rH1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rF1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>`;
  const rR = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footnotes.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footnotes+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const st = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>${FONT}<w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:jc w:val="both"/></w:pPr></w:style><w:style w:type="character" w:styleId="FootnoteReference"><w:name w:val="footnote reference"/><w:rPr><w:vertAlign w:val="superscript"/></w:rPr></w:style></w:styles>`;
  const se = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="709"/></w:settings>`;
  const files = [
    { name: "[Content_Types].xml", data: s2u(ct) }, { name: "_rels/.rels", data: s2u(rR) },
    { name: "word/document.xml", data: s2u(docXml) }, { name: "word/styles.xml", data: s2u(st) },
    { name: "word/settings.xml", data: s2u(se) }, { name: "word/header1.xml", data: s2u(headerXml) },
    { name: "word/footer1.xml", data: s2u(footerXml) }, { name: "word/_rels/document.xml.rels", data: s2u(rD) },
    { name: "word/footnotes.xml", data: s2u(footnotesXml) },
  ];
  const zip = buildZip(files);
  let bin = ""; const chunk = 8192;
  for (let i = 0; i < zip.length; i += chunk) bin += String.fromCharCode(...zip.subarray(i, i + chunk));
  const b64 = btoa(bin);
  const slug = (nomeLivro || "JurEditPro").replace(/[^a-zA-Z0-9]/g, "_").slice(0, 28);
  const fname = slug + "_" + new Date().toISOString().slice(0, 10) + ".docx";
  const dataUri = "data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64," + b64;
  let url; try { url = URL.createObjectURL(new Blob([zip], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })); } catch (_) { url = dataUri; }
  const a = document.createElement("a"); a.href = url; a.download = fname; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); if (url !== dataUri) URL.revokeObjectURL(url); }, 1000);
  return { dataUri, filename: fname };
}

function exportarMarkdown(text, nomeLivro) {
  const clean = text.replace(/\[Fonte:[^\]]+\]/g, "").replace(/^EMENTA_CAP:/gim, "> **Ementa:**").trim();
  const slug = (nomeLivro || "JurEditPro").replace(/[^a-zA-Z0-9]/g, "_").slice(0, 28);
  const fname = slug + "_" + new Date().toISOString().slice(0, 10) + ".md";
  const blob = new Blob([clean], { type: "text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = fname; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

// ══════════════════════════════════════════════
// ABNT FORMATTER — NBR 6023:2018 (Fase 3.5)
// ══════════════════════════════════════════════

function abntNormAutor(autor) {
  if (!autor?.trim()) return "[S.n.]";
  const s = autor.replace(/\s+/g," ").trim();
  if (s.includes(",")) { const [sob,...rest]=s.split(","); return `${sob.trim().toUpperCase()}, ${rest.join(",").trim()}`; }
  const partes = s.split(/\s+/).filter(Boolean);
  if (partes.length===1) return partes[0].toUpperCase();
  const particulas = new Set(["de","da","do","das","dos","e","van","von","del","di","du","le","la"]);
  const sob = partes.pop();
  const sobBase = particulas.has(sob.toLowerCase())&&partes.length>0 ? `${partes.pop()} ${sob}` : sob;
  return `${sobBase.toUpperCase()}, ${partes.join(" ")}`;
}
function abntSobrenome(autor) {
  if (!autor?.trim()) return "[s.n.]";
  const s = autor.replace(/\s+/g," ").trim();
  if (s.includes(",")) return s.split(",")[0].trim();
  const partes = s.split(/\s+/).filter(Boolean);
  return partes[partes.length-1]||s;
}
function abntFmtEd(ed) { const n=parseInt(String(ed),10); return isNaN(n)?String(ed):`${n}.`; }
function abntFmtData(data) {
  if (!data) return "[s.d.]";
  const MESES=["jan.","fev.","mar.","abr.","maio","jun.","jul.","ago.","set.","out.","nov.","dez."];
  const iso=data.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${parseInt(iso[3],10)} ${MESES[parseInt(iso[2],10)-1]||iso[2]} ${iso[1]}`;
  const br=data.match(/^(\d{1,2})\/(\d{2})\/(\d{4})/);
  if (br) return `${parseInt(br[1],10)} ${MESES[parseInt(br[2],10)-1]||br[2]} ${br[3]}`;
  return data;
}
function abntLimparPonto(str) { return String(str||"").trim().replace(/\.+$/,""); }

function abntFormatarLivro(ref) {
  const {autor,titulo,subtitulo,edicao,local,editora,ano,paginas,organizador,serie,isbn}=ref;
  const autorStr=autor?abntNormAutor(autor)+".":organizador?`${abntNormAutor(organizador)} (org.).`:"[S.n.].";
  const subStr=subtitulo?`: ${subtitulo.trim()}`:"";
  const edStr=edicao?` ${abntFmtEd(edicao)} ed.`:"";
  const pgStr=paginas?` ${paginas} p.`:"";
  const serStr=serie?` (${serie}).`:"";
  const isbnStr=isbn?` ISBN ${isbn}.`:"";
  return `${autorStr} **${titulo}**${subStr}.${edStr} ${local||"[S.l.]"}: ${editora||"[s.n.]"}, ${ano}.${pgStr}${serStr}${isbnStr}`.trim();
}
function abntFormatarArtigo(ref) {
  const {autor,tituloArtigo,tituloRevista,volume,numero,paginas,ano,mes,doi,url,acessoEm}=ref;
  const volStr=volume?`, v. ${volume}`:"";
  const numStr=numero?`, n. ${numero}`:"";
  const pgStr=paginas?`, p. ${paginas}`:"";
  const mesStr=mes?` ${mes} `:" ";
  const doiStr=doi?` DOI: https://doi.org/${doi.replace(/^https?:\/\/doi\.org\//,"")}.`:"";
  const urlStr=url&&!doi?` Disponível em: <${url}>. Acesso em: ${acessoEm||"data não informada"}.`:"";
  return `${abntNormAutor(autor)}. ${tituloArtigo}. **${tituloRevista}**${volStr}${numStr}${pgStr},${mesStr}${ano}.${doiStr}${urlStr}`.trim();
}
function abntFormatarTese(ref) {
  const {autor,titulo,grau,programa,instituicao,local,ano,paginas,url,acessoEm}=ref;
  const grauStr=grau==="doutorado"?"Tese (Doutorado)":"Dissertação (Mestrado)";
  const pgStr=paginas?` ${paginas} f.`:"";
  const progStr=programa?`${programa}, `:"";
  const urlStr=url?` Disponível em: <${url}>. Acesso em: ${acessoEm||"data não informada"}.`:"";
  return `${abntNormAutor(autor)}. **${titulo}**.${pgStr} ${ano}. ${grauStr} — ${progStr}${instituicao||""}, ${local||""}, ${ano}.${urlStr}`;
}
function abntFormatarLei(ref) {
  const {pais="Brasil",jurisdicao,tipoNorma,numero,data,ementa,url,diario}=ref;
  const jur=jurisdicao?`${jurisdicao}. `:"";
  const tipo=tipoNorma||"Lei";
  const dStr=diario?` ${diario}.`:"";
  const urlStr=url?` Disponível em: <${url}>.`:"";
  return `${pais}. ${jur}${tipo} n. ${numero}, de ${abntFmtData(data)}. ${abntLimparPonto(ementa)}.${dStr}${urlStr}`;
}
function abntFormatarAcordao(ref) {
  const {tribunal,tipoDecisao="Acórdão",numero,relator,orgaoJulgador,dataJulgamento,ementa,publicacao,url}=ref;
  const relStr=relator?` Relator: ${relator}.`:"";
  const orgStr=orgaoJulgador?` ${orgaoJulgador}.`:"";
  const dtStr=dataJulgamento?` Julgado em ${abntFmtData(dataJulgamento)}.`:"";
  const emtStr=ementa?` Ementa: ${abntLimparPonto(ementa)}.`:"";
  const pubStr=publicacao?` ${publicacao}.`:"";
  const urlStr=url?` Disponível em: <${url}>.`:"";
  return `${tribunal}. ${tipoDecisao} ${numero}.${relStr}${orgStr}${dtStr}${emtStr}${pubStr}${urlStr}`.trim();
}
function abntFormatarWeb(ref) {
  const {autor,organizacao,titulo,subtitulo,ano,url,acessoEm}=ref;
  const autorStr=autor?abntNormAutor(autor)+". ":organizacao?`${organizacao}. `:"";
  const subStr=subtitulo?`: ${subtitulo}`:"";
  return `${autorStr}**${titulo}**${subStr}. ${ano||"[s.d.]"}. Disponível em: <${url}>. Acesso em: ${acessoEm||new Date().toLocaleDateString("pt-BR")}.`;
}

function abntDetectarTipo(ref) {
  if (!ref||typeof ref!=="object") return "livro";
  if (ref._tipo) return ref._tipo;
  const k=Object.keys(ref);
  if (k.includes("tituloArtigo")||k.includes("tituloRevista")||ref.doi) return "artigo";
  if (k.includes("tribunal")||k.includes("relator")||k.includes("dataJulgamento")) return "acordao";
  if (k.includes("programa")||ref.grau==="doutorado"||ref.grau==="mestrado") return "tese";
  if (k.includes("tipoNorma")&&k.includes("numero")&&k.includes("ementa")) return "lei";
  if (k.includes("tituloCapitulo")||k.includes("autorOrg")) return "capitulo";
  if (k.includes("url")&&!k.includes("editora")) return "web";
  return "livro";
}

function abntFormatar(ref, pagina) {
  if (!ref) return { abnt:"[referência vazia]", notaRodape:"[s.n.]", citacaoTexto:"", tipo:"desconhecido" };
  const tipo=abntDetectarTipo(ref);
  let abnt="";
  try {
    if (tipo==="livro"||tipo==="capitulo") abnt=abntFormatarLivro(ref);
    else if (tipo==="artigo")  abnt=abntFormatarArtigo(ref);
    else if (tipo==="tese")    abnt=abntFormatarTese(ref);
    else if (tipo==="lei")     abnt=abntFormatarLei(ref);
    else if (tipo==="acordao") abnt=abntFormatarAcordao(ref);
    else if (tipo==="web")     abnt=abntFormatarWeb(ref);
    else abnt=abntFormatarLivro(ref);
  } catch(e) { abnt=`[Erro: ${e.message}]`; }
  const pg=pagina?`, p. ${pagina}`:"";
  let notaRodape="[s.n.]";
  try {
    if (tipo==="livro"||tipo==="capitulo") { const sob=abntSobrenome(ref.autor||ref.organizador||""); const ed=ref.edicao?`, ${abntFmtEd(ref.edicao)} ed.`:""; notaRodape=`${sob}, *${ref.titulo||ref.tituloCapitulo||"[s.t.]"}*${ed}, ${ref.ano}${pg}.`; }
    else if (tipo==="artigo") notaRodape=`${abntSobrenome(ref.autor||"")}, "${ref.tituloArtigo}", *${ref.tituloRevista}*, ${ref.ano}${pg}.`;
    else if (tipo==="tese") { const gl=ref.grau==="doutorado"?"Tese":"Dissertação"; notaRodape=`${abntSobrenome(ref.autor||"")}, *${ref.titulo}* (${gl} — ${ref.instituicao||""}, ${ref.ano})${pg}.`; }
    else if (tipo==="lei") notaRodape=`${ref.pais||"Brasil"}, ${ref.tipoNorma||"Lei"} n. ${ref.numero}, de ${abntFmtData(ref.data)}.`;
    else if (tipo==="acordao") { const org=ref.orgaoJulgador?`, ${ref.orgaoJulgador}`:""; const rel=ref.relator?`, Rel. ${abntSobrenome(ref.relator)}`:""; notaRodape=`${ref.tribunal}${org}, ${ref.tipoDecisao||"Acórdão"} ${ref.numero}${rel}, j. ${abntFmtData(ref.dataJulgamento)}.`; }
    else if (tipo==="web") { const aut=ref.autor?abntSobrenome(ref.autor)+", ":ref.organizacao?`${ref.organizacao}, `:""; notaRodape=`${aut}*${ref.titulo}*, ${ref.ano||"[s.d.]"}. Disponível em: <${ref.url}>.`; }
  } catch {}
  const citacaoTexto=(tipo==="lei"||tipo==="acordao")?`(${(ref.pais||ref.tribunal||"BRASIL").toUpperCase()}, ${(ref.data||ref.dataJulgamento||"").slice(-4)||"[s.d.]"})`:
    `(${abntSobrenome(ref.autor||"").toUpperCase()}, ${ref.ano||"[s.d.]"}${pg})`;
  return { abnt, notaRodape, citacaoTexto, tipo };
}

function abntGerarListaReferencias(refs) {
  if (!refs?.length) return "";
  return "REFERÊNCIAS\n\n"+[...refs].sort((a,b)=>(abntSobrenome(a.autor||a.organizacao||a.tribunal||a.pais||"")).localeCompare(abntSobrenome(b.autor||b.organizacao||b.tribunal||b.pais||""),"pt-BR")).map(r=>{ try{ return abntFormatar(r).abnt; } catch{ return "[Referência com erro]"; } }).join("\n\n");
}

const CORS_PROXY = "https://api.allorigins.win/get?url=";

async function fetchViaProxy(url) {
  const res = await fetch(CORS_PROXY + encodeURIComponent(url), { headers:{ Accept:"application/json" } });
  if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
  const json = await res.json();
  return json.contents || json;
}

const OAI_REPOSITORIES = [
  { id:"bdtd",    label:"BDTD — IBICT",        homepageURL:"https://bdtd.ibict.br/" },
  { id:"usp",     label:"Repositório USP",      homepageURL:"https://www.teses.usp.br/" },
  { id:"unicamp", label:"Repositório UNICAMP",  homepageURL:"https://repositorio.unicamp.br/" },
  { id:"ufrj",    label:"Pantheon — UFRJ",      homepageURL:"https://pantheon.ufrj.br/" },
];

const LEXML_TIPOS_LIST = [
  { id:"todos",             label:"Todos os tipos" },
  { id:"lei.ordinaria",     label:"Lei Ordinária" },
  { id:"lei.complementar",  label:"Lei Complementar" },
  { id:"decreto",           label:"Decreto" },
  { id:"medida.provisoria", label:"Medida Provisória" },
  { id:"resolucao",         label:"Resolução" },
  { id:"portaria",          label:"Portaria" },
  { id:"emenda.constitucional", label:"Emenda Constitucional" },
];

function oaiClean(str) { return String(str||"").replace(/\s+/g," ").trim(); }

function parseVuFind(json) {
  return (json?.records||[]).map(r=>({
    titulo: oaiClean(r.title||r.shortTitle||"Sem título"),
    autor:  oaiClean(Array.isArray(r.author)?r.author[0]:r.author||"Autor desconhecido"),
    ano:    String(r.publishDate?.[0]||r.year||""),
    resumo: oaiClean(r.summary?.[0]||r.abstract||""),
    url:    r.urls?.[0]?.url||r.url||"",
    tipo:   r.formats?.[0]||"Tese/Dissertação",
    fonte:  "BDTD — IBICT",
  }));
}

function parseOAIXML(xmlStr, repoLabel) {
  const doc = new DOMParser().parseFromString(xmlStr,"text/xml");
  const records = [];
  doc.querySelectorAll("record").forEach(item=>{
    const dc=tag=>oaiClean(item.querySelector(`dc\\:${tag}, ${tag}`)?.textContent||"");
    const dcAll=tag=>[...item.querySelectorAll(`dc\\:${tag}, ${tag}`)].map(e=>oaiClean(e.textContent));
    const titulo=dc("title"); if(!titulo) return;
    records.push({ titulo, autor:dcAll("creator").join("; ")||"Autor desconhecido", ano:(dc("date")||"").slice(0,4), resumo:dc("description"), url:dcAll("identifier").find(s=>s.startsWith("http"))||"", tipo:dc("type")||"Tese/Dissertação", fonte:repoLabel });
  });
  return records;
}

async function buscarTesesOAI(keyword, options={}) {
  const { repoId="bdtd", maxResults=20 } = options;
  const repo = OAI_REPOSITORIES.find(r=>r.id===repoId)||OAI_REPOSITORIES[0];
  try {
    if (repo.id==="bdtd") {
      const url=`https://bdtd.ibict.br/vufind/api/v1/search?type=AllFields&lookfor=${encodeURIComponent(keyword)}&limit=${maxResults}&sort=relevance&field[]=title&field[]=author&field[]=publishDate&field[]=abstract&field[]=url`;
      let json;
      try { const r=await fetch(url,{headers:{Accept:"application/json"}}); json=await r.json(); }
      catch { json=JSON.parse(await fetchViaProxy(url)); }
      return parseVuFind(json).slice(0,maxResults);
    }
    const baseURLs={ usp:"https://www.teses.usp.br/index.php/oai/", unicamp:"https://repositorio.unicamp.br/oai/request", ufrj:"https://pantheon.ufrj.br/oai/request" };
    const url=`${baseURLs[repo.id]||baseURLs.usp}?verb=ListRecords&metadataPrefix=oai_dc`;
    const xmlStr=await fetchViaProxy(url);
    return parseOAIXML(xmlStr,repo.label).filter(r=>r.titulo.toLowerCase().includes(keyword.toLowerCase().slice(0,8))).slice(0,maxResults);
  } catch(err) {
    return [{ _erro:true, mensagem:err.message, fonte:repo.label }];
  }
}

async function buscarLegislacaoLexML(termo, options={}) {
  const { tipo="todos", maxResults=20 } = options;
  const tipoClause=tipo&&tipo!=="todos"?` and urn.local.tipo = "${tipo}"`:"";
  const cql=encodeURIComponent(`(dc.title any ${termo} or dc.subject any ${termo})${tipoClause}`);
  const url=`https://www.lexml.gov.br/busca/SRU?operation=searchRetrieve&version=1.2&query=${cql}&maximumRecords=${maxResults}&recordSchema=oai_dc`;
  try {
    let xmlStr;
    try { const r=await fetch(url,{headers:{Accept:"application/xml, text/xml"}}); if(!r.ok) throw new Error(); xmlStr=await r.text(); }
    catch { xmlStr=await fetchViaProxy(url); }
    const doc=new DOMParser().parseFromString(xmlStr,"text/xml");
    const records=[];
    doc.querySelectorAll("recordData, record").forEach(item=>{
      const dc=tag=>oaiClean(item.querySelector(`dc\\:${tag}, ${tag}`)?.textContent||"");
      const dcAll=tag=>[...item.querySelectorAll(`dc\\:${tag}, ${tag}`)].map(e=>oaiClean(e.textContent));
      const titulo=dc("title")||dc("identifier"); if(!titulo) return;
      const ids=dcAll("identifier");
      const urn=ids.find(s=>s.startsWith("urn:lex"))||"";
      const urlH=ids.find(s=>s.startsWith("http"))||"";
      records.push({ titulo, ementa:dc("description"), data:(dc("date")||"").slice(0,10), tipo:dc("type")||"Legislação", urn, url:urlH||(urn?`https://www.lexml.gov.br/urn/${encodeURIComponent(urn)}`:""), fonte:"LexML Brasil" });
    });
    return records.slice(0,maxResults);
  } catch(err) {
    return [{ _erro:true, mensagem:err.message, fonte:"LexML Brasil" }];
  }
}

function tesesParaItem(tese) {
  const ref={autor:tese.autor,titulo:tese.titulo,grau:"mestrado",programa:"Programa de Pós-Graduação",instituicao:tese.fonte,local:"Brasil",ano:tese.ano,url:tese.url,acessoEm:new Date().toLocaleDateString("pt-BR"),_tipo:"tese"};
  const {abnt,notaRodape}=abntFormatar(ref);
  return { id:`${Date.now()}_${Math.random().toString(36).slice(2,6)}`, titulo:tese.titulo, autor:tese.autor, ano:tese.ano, tipo:"tese", url:tese.url, fonte:tese.fonte, resumo:tese.resumo, abntRef:abnt, notaRodape, selecionado:false };
}

function legParaItem(leg) {
  const ref={pais:"Brasil",tipoNorma:leg.tipo||"Lei",numero:leg.titulo.replace(/[^\d.]/g,"").slice(0,12)||"s/n",data:leg.data,ementa:leg.ementa||leg.titulo,url:leg.url,_tipo:"lei"};
  const {abnt,notaRodape}=abntFormatar(ref);
  return { id:`${Date.now()}_${Math.random().toString(36).slice(2,6)}`, titulo:leg.titulo, autor:"Brasil", ano:(leg.data||"").slice(0,4), tipo:"legislacao", url:leg.url, fonte:"LexML Brasil", resumo:leg.ementa||"", abntRef:abnt, notaRodape, selecionado:false };
}

function importarDoutrinaParaCapitulo(capitulo, itens) {
  const sels=itens.filter(i=>i.selecionado);
  if(!sels.length) return capitulo;
  const exist=new Set((capitulo.doutrina||[]).map(d=>d.id));
  return { ...capitulo, doutrina:[...(capitulo.doutrina||[]),...sels.filter(i=>!exist.has(i.id))] };
}

function gerarBlocoRefDoutrina(doutrina) {
  if(!doutrina?.length) return "";
  return "REFERÊNCIAS\n\n"+[...doutrina].sort((a,b)=>(a.autor||"").localeCompare(b.autor||"","pt-BR")).map(d=>d.abntRef||`${d.autor||"[s.n.]"}. **${d.titulo}**. ${d.ano}.`).join("\n\n");
}

async function chamarClaudeStream(messages, system, onChunk, onStatus) {
  const WAITS = [15, 30, 60];
  for (let t = 0; t <= 3; t++) {
    if (t > 0) { for (let s = WAITS[t-1]; s > 0; s--) { onStatus?.(`Aguardando ${s}s (tentativa ${t+1}/4)...`); await new Promise(r => setTimeout(r, 1000)); } }
    onStatus?.(t === 0 ? "⚖️ Claude Sonnet 4 gerando..." : `🔄 Tentativa ${t+1}/4...`);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json","anthropic-version":"2023-06-01"},
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:16000, stream:true, system, messages }),
      });
      if (res.status===529||res.status===503) { if(t<3) continue; throw new Error("API sobrecarregada."); }
      if (res.status===429) { for(let s=30;s>0;s--){onStatus?.(`Rate limit — ${s}s...`);await new Promise(r=>setTimeout(r,1000));} t--;continue; }
      if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(`Erro ${res.status}: ${e?.error?.message||res.statusText}`); }
      const reader=res.body.getReader(), decoder=new TextDecoder(); let full="",buf="";
      while(true) {
        const {done,value}=await reader.read(); if(done) break;
        buf+=decoder.decode(value,{stream:true});
        const lines=buf.split("\n"); buf=lines.pop();
        for(const line of lines) {
          if(!line.startsWith("data:")) continue;
          const raw=line.slice(5).trim(); if(raw==="[DONE]") continue;
          try{const ev=JSON.parse(raw);if(ev.type==="content_block_delta"&&ev.delta?.type==="text_delta"){full+=ev.delta.text;onChunk?.(full);}}catch{}
        }
      }
      if(full){onStatus?.("");return full;} if(t<3) continue; throw new Error("Resposta vazia.");
    } catch(e) {
      if(e.message&&e.message.includes("stream")) return await chamarClaudeFallback(messages,system,onStatus);
      if(t===3) throw e;
    }
  }
  throw new Error("Falha após 4 tentativas.");
}

async function chamarClaudeFallback(messages, system, onStatus) {
  onStatus?.("⚖️ Claude gerando (modo direto)...");
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:16000,system,messages})});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`Erro ${res.status}: ${e?.error?.message||res.statusText}`);}
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
  if(!text) throw new Error("Resposta vazia."); onStatus?.(""); return text;
}

async function chamarGemini(messages, system, apiKey, onStatus) {
  if(!apiKey?.trim()) throw new Error("Cole a chave do Google AI Studio nas configurações.");
  const MODELS=["gemini-2.5-flash","gemini-2.5-flash-preview-05-20","gemini-2.0-flash"];
  for(const model of MODELS) {
    for(let t=0;t<=2;t++) {
      if(t>0){for(let s=30;s>0;s--){onStatus?.(`Gemini — ${s}s...`);await new Promise(r=>setTimeout(r,1000));}}
      onStatus?.(`🔮 Gemini (${model}) gerando...`);
      try {
        const contents=messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
        const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents,systemInstruction:{parts:[{text:system}]},generationConfig:{maxOutputTokens:8192,temperature:0.75}})});
        if(res.status===404) break; if(res.status===429){if(t<2)continue;break;}
        if(res.status===400){const e=await res.json().catch(()=>({}));if(e?.error?.message?.includes("API_KEY"))throw new Error("Chave Gemini inválida.");break;}
        if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`Gemini ${res.status}: ${e?.error?.message||res.statusText}`);}
        const data=await res.json(); const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"";
        if(text){onStatus?.("");return text;} break;
      } catch(e) {
        if(e.message.includes("Failed to fetch")) throw new Error("Gemini bloqueado neste ambiente. Use Claude.");
        if(t===2) throw e;
      }
    }
  }
  throw new Error("Nenhum modelo Gemini disponível. Use Claude.");
}

  const ps = {
    livro:`${h}TEMA: ${tema}\n\nGere capítulo COMPLETO de tratado jurídico acadêmico.\n\nESTRUTURA OBRIGATÓRIA:\nTÍTULO DO CAPÍTULO EM CAIXA ALTA\nEMENTA_CAP: [subtemas]\n---\n\n**Abertura — Contextualização e Problema Central**\n[3 parágrafos]\n\n**Conceito, Natureza Jurídica e Delimitação Dogmática**\n[4+ parágrafos com notas ¹²³]\n\n**Regime Jurídico: Requisitos, Elementos e Efeitos**\n[4+ parágrafos · legislação vigente]\n\n**Análise Jurisprudencial STJ e STF (2020–2025)**\n> *EMENTA: [resumo]. (STJ, REsp X.XXX/UF, Rel. Min. Nome, Nª Turma, DJe DD.MM.AAAA.)*\n[Mínimo 4 precedentes]\n\n**Controvérsias Doutrinárias e Tendências 2025**\n[3+ parágrafos]\n\nSíntese do Capítulo\n[3 parágrafos]\n\n② NOTAS DE RODAPÉ\n¹ Prenome Sobrenome, *Título*, N. ed., Cidade, Editora, ano, p. XX.\n[MÍNIMO 25 NOTAS]`,
    sumario:`${h}OBRA: ${tema}\n\nGere SUMÁRIO COMPLETO com numeração ABNT (1/1.1/1.1.1), mínimo 10 capítulos, páginas estimadas ponteadas: 1.1 Conceito......................15`,
    parecer:`${h}QUESTÃO JURÍDICA: ${tema}\n\nElabore PARECER JURÍDICO COMPLETO.\n\nEMENTA\n[5-8 linhas]\n\nI — RELATÓRIO\nII — FUNDAMENTAÇÃO JURÍDICA\n**1. Análise do Quadro Normativo**\n**2. Posicionamento Doutrinário**\n**3. Jurisprudência dos Tribunais Superiores**\n**4. Síntese e Conclusão Fundamentada**\n\nIII — CONCLUSÃO\n[Respostas numeradas]\n\n② NOTAS DE RODAPÉ [mínimo 20]`,
    peticao:`${h}OBJETO DA AÇÃO: ${tema}\n\nRedije PETIÇÃO JURÍDICA COMPLETA.\n\nEXCELENTÍSSIMO SENHOR DOUTOR JUIZ DE DIREITO...\n\nI — DOS FATOS\nII — DO DIREITO\n**1. Da Legitimidade e Interesse de Agir**\n**2. Do Mérito — Fundamento Legal**\n**3. Da Jurisprudência Aplicável**\n\nIII — DOS PEDIDOS\n\n② NOTAS DE RODAPÉ [mínimo 15]`,
    artigo:`${h}TEMA: ${tema}\n\nEscreva ARTIGO CIENTÍFICO JURÍDICO COMPLETO (Qualis A2 CAPES).\n\nTÍTULO EM MAIÚSCULAS\nResumo [150-250 palavras]\nPalavras-chave: [5-7]\nAbstract / Keywords\n1 INTRODUÇÃO\n2 [DESENVOLVIMENTO]\n3 CONSIDERAÇÕES FINAIS\nREFERÊNCIAS [ABNT NBR 6023:2018 — mínimo 20]\n\n② NOTAS DE RODAPÉ`,
    apostila:`${h}TEMA: ${tema}\n\nCrie APOSTILA JURÍDICA DIDÁTICA COMPLETA com módulos, jurisprudência comentada, exercícios e gabarito.`,

  };
  return modos[modo]||modos.mapa;

function contarPalavras(text) { return text ? text.trim().split(/\s+/).filter(Boolean).length : 0; }
function contarNotas(text) { return (text.match(/[¹²³⁴⁵⁶⁷⁸⁹⁰]+/g)||[]).length; }

async function copiar(text) {
  const c = text.replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1").replace(/\[Fonte:[^\]]+\]/g,"");
  try { await navigator.clipboard.writeText(c); return true; } catch {
    const ta=document.createElement("textarea"); ta.value=c;
    Object.assign(ta.style,{position:"fixed",top:0,left:0,opacity:0,pointerEvents:"none"});
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{document.execCommand("copy");document.body.removeChild(ta);return true;}catch{document.body.removeChild(ta);return false;}
  }
}

function Linhas({ text, dark }) {
  const fg=dark?"#e2d9cc":"#0f0e0c", fgSub=dark?"#9e9e9e":"#666", fgHead=dark?"#f0ead8":"#0f1a33";
  const blockBg=dark?"#1a2744":"#fdfaf4", blockBorder="#c9a84c";
  return (<>{text.split("\n").map((line,i)=>{
    const l=line.trim();
    if(!l) return <div key={i} style={{height:7}}/>;
    if(/^\*\*[^*]+\*\*$/.test(l)) return <div key={i} style={{fontWeight:700,color:fgHead,marginTop:16,marginBottom:5,fontSize:13.5,borderLeft:`3px solid ${blockBorder}`,paddingLeft:10}}>{l.replace(/\*\*/g,"")}</div>;
    if(/^>/.test(l)) return <div key={i} style={{borderLeft:`4px solid ${blockBorder}`,padding:"8px 14px",margin:"10px 0",color:dark?"#c9a84c":"#3a2800",fontStyle:"italic",fontSize:12,lineHeight:1.75,background:blockBg,borderRadius:"0 4px 4px 0"}}>{l.replace(/^>\s*/,"")}</div>;
    if(/^[①②③④⑤⑥⑦]/.test(l)) return <div key={i} style={{fontWeight:700,fontSize:11,color:dark?"#f87171":"#8b1a1a",borderBottom:`1px solid ${dark?"#2a3550":"#e5e0d8"}`,paddingBottom:4,marginTop:18,marginBottom:7,textTransform:"uppercase",letterSpacing:".06em"}}>{l}</div>;
    if(/^[¹²³⁴⁵⁶⁷⁸⁹]/.test(l)||(/^\d{1,2}[.\s]/.test(l)&&l.length<400)) return <div key={i} style={{fontSize:11,color:fgSub,lineHeight:1.65,paddingLeft:20,textIndent:"-20px",marginBottom:3}}>{l}</div>;
    if(/^#{1,3}\s/.test(l)) return <div key={i} style={{fontWeight:700,color:fgHead,marginTop:16,marginBottom:5,fontSize:13.5}}>{l.replace(/^#+\s/,"")}</div>;
    if(/^•/.test(l)) return <div key={i} style={{fontSize:12,color:fg,lineHeight:1.75,paddingLeft:16,textIndent:"-16px",marginBottom:4}}>{l}</div>;
    const segs=l.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/);
    return <p key={i} style={{margin:"0 0 7px",textAlign:"justify",lineHeight:1.9,color:fg}}>{segs.map((s,j)=>{
      if(/^\*\*[^*]+\*\*$/.test(s)) return <strong key={j}>{s.slice(2,-2)}</strong>;
      if(/^\*[^*]+\*$/.test(s)) return <em key={j}>{s.slice(1,-1)}</em>;
      return <span key={j}>{s}</span>;
    })}</p>;
  })}</>);
}

function Toast({ msg, onClose }) {
  useEffect(()=>{ if(msg){const t=setTimeout(onClose,3000);return()=>clearTimeout(t);} },[msg]);
  if(!msg) return null;
  return <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#0f1a33",color:"#c9a84c",padding:"10px 20px",borderRadius:8,fontSize:12,fontFamily:"monospace",fontWeight:700,zIndex:9999,boxShadow:"0 4px 20px rgba(0,0,0,.4)",border:"1px solid rgba(201,168,76,.4)",animation:"jup .2s ease"}}>{msg}</div>;
}

                  <button onClick={()=>{setLoading(false);setStatus("");setStreamText("");}} style={{padding:"3px 9px",background:"#991b1b",border:"none",borderRadius:3,color:"white",fontSize:9,fontFamily:"monospace",cursor:"pointer"}}>✕ Cancelar</button>
                </div>
              )}
              <div ref={botRef}/>
            </div>
            {/* Rodapé Editor */}
            <div style={{background:CARD,borderTop:`1px solid ${BORDER}`,padding:"11px 15px",flexShrink:0}}>
              <div style={{marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                  <span style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em"}}>📌 Descrição do problema / contexto jurídico</span>
                  <span style={{fontSize:8,color:darkMode?"#4a5568":"#bbb",fontFamily:"monospace"}}>(opcional mas recomendado)</span>
                  {capituloAtivo.doutrina.length>0&&(
                    <button onClick={()=>{setProblema(p=>p?(p+"\n\n"+gerarBlocoRefDoutrina(capituloAtivo.doutrina)):gerarBlocoRefDoutrina(capituloAtivo.doutrina));setToast(`📌 ${capituloAtivo.doutrina.length} referências adicionadas ao contexto`);}}
                      style={{fontSize:8,fontFamily:"monospace",padding:"2px 7px",border:`1px solid ${G}40`,background:"transparent",color:G,cursor:"pointer",borderRadius:3,marginLeft:"auto"}}>
                      📌 Usar {capituloAtivo.doutrina.length} ref. importada{capituloAtivo.doutrina.length!==1?"s":""}
                    </button>
                  )}
                </div>
                <textarea value={problema} onChange={e=>setProblema(e.target.value)} rows={3}
                  placeholder="Descreva o problema jurídico, caso concreto ou controvérsia. Pode colar aqui as fontes encontradas nas Bibliotecas ou importadas via Sidebar Doutrina."
                  style={{width:"100%",padding:"9px 12px",border:`1px solid ${G}40`,fontFamily:"Georgia,serif",fontSize:12,resize:"none",outline:"none",borderRadius:6,lineHeight:1.65,background:darkMode?"rgba(201,168,76,.04)":"#fdfaf4",maxHeight:140,transition:"all .2s",color:N}}
                  onFocus={e=>{e.target.style.borderColor=G;e.target.style.background=darkMode?"rgba(201,168,76,.07)":"white";}}
                  onBlur={e=>{e.target.style.borderColor=`${G}40`;e.target.style.background=darkMode?"rgba(201,168,76,.04)":"#fdfaf4";}}
                />
              </div>
              <div style={{display:"flex",gap:7,alignItems:"flex-end"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em",marginBottom:4}}>Tema / Título ({TIPOS_DOC.find(t=>t.id===tipo)?.l})</div>
                  <textarea ref={taRef} rows={2} value={tema} onChange={e=>setTema(e.target.value)}
                    onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
                    placeholder="Ex: Licitação inexigível — Lei 14.133/2021"
                    style={{width:"100%",padding:"8px 11px",border:`1px solid ${BORDER}`,fontFamily:"Georgia,serif",fontSize:13,resize:"none",outline:"none",borderRadius:5,lineHeight:1.6,background:CR,maxHeight:100,transition:"all .2s",color:N}}
                    onFocus={e=>{e.target.style.borderColor=G;e.target.style.background=CARD;}}
                    onBlur={e=>{e.target.style.borderColor=BORDER;e.target.style.background=CR;}}
                  />
                </div>
                <button onClick={()=>send()} disabled={loading||!tema.trim()}
                  style={{width:44,height:44,background:(loading||!tema.trim())?(darkMode?"#1e2d45":"#d4cfc6"):(darkMode?"#1a2744":"#0f1a33"),border:"none",borderRadius:5,cursor:(loading||!tema.trim())?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .2s"}}
                  onMouseEnter={e=>{if(!loading&&tema.trim())e.currentTarget.style.background="#8b1a1a";}}
                  onMouseLeave={e=>{if(!loading&&tema.trim())e.currentTarget.style.background=darkMode?"#1a2744":"#0f1a33";}}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
              </div>
              <div style={{display:"flex",gap:5,marginTop:7,flexWrap:"wrap",alignItems:"center"}}>
                {["Desenvolver texto completo","Buscar jurisprudência","Avaliação técnica","Continuar texto","Revisar ABNT"].map((a,i)=>(
                  <button key={i} className="ch" onClick={()=>setTema(t=>{const b=t||"[insira o tema]";if(a==="Continuar texto")return `Continue de onde parou:\n\n${b}`;return `${a} sobre: ${b}`;})} style={{fontSize:9.5,fontFamily:"monospace",padding:"3px 8px",border:`1px solid ${BORDER}`,background:"transparent",color:TEXT2,cursor:"pointer",borderRadius:3}}>{a}</button>
                ))}
                {/* Botão Sidebar Doutrina */}
                <button onClick={()=>setShowSidebar(s=>!s)}
                  style={{fontSize:9.5,fontFamily:"monospace",padding:"3px 8px",border:`1px solid ${showSidebar?"#7c3aed":BORDER}`,background:showSidebar?"rgba(124,58,237,.12)":"transparent",color:showSidebar?"#7c3aed":TEXT2,cursor:"pointer",borderRadius:3,transition:"all .15s"}}>
                  📚 {showSidebar?"Fechar Doutrina":"Importar Doutrina"}
                </button>
                {msgs.length>0&&(
                  <>
                    <button onClick={salvarSessao} style={{fontSize:9.5,fontFamily:"monospace",padding:"3px 8px",border:"1px solid rgba(34,197,94,.4)",background:"transparent",color:darkMode?"#4ade80":"#166534",cursor:"pointer",borderRadius:3}}>💾 Salvar sessão</button>
                    <button onClick={novaSessao} style={{fontSize:9.5,fontFamily:"monospace",padding:"3px 8px",border:"1px solid #fca5a5",background:"transparent",color:"#b91c1c",cursor:"pointer",borderRadius:3,marginLeft:"auto"}}>🗑 Limpar</button>
                  </>
                )}
                {problema&&<button onClick={()=>setProblema("")} style={{fontSize:9,fontFamily:"monospace",padding:"3px 8px",border:"1px solid #fca5a5",background:"transparent",color:"#b91c1c",cursor:"pointer",borderRadius:3}}>✕ limpar contexto</button>}
              </div>
            </div>
          </div>
          {/* ── SIDEBAR DOUTRINA (coluna lateral) ── */}
          {showSidebar&&(
            <div style={{width:400,flexShrink:0,borderLeft:`2px solid #7c3aed40`,overflow:"hidden",display:"flex",flexDirection:"column"}}>
              <SidebarDoutrina
                capitulo={capituloAtivo}
                onImportar={cap=>{setCapituloAtivo(cap);setToast(`✅ ${cap.doutrina.length} fonte${cap.doutrina.length!==1?"s":""} no capítulo`);}}
                onFechar={()=>setShowSidebar(false)}
                onUsar={bloco=>{setProblema(p=>p?(p+"\n\n"+bloco):bloco);setToast("📌 Referências adicionadas ao contexto!");}}
                darkMode={darkMode}
                areaJuridica={area}
              />
            </div>
          )}
        </div>
      )}

      {/* ══════════ TEMPLATES ══════════ */}
      {tab==="templates"&&(
        <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
          <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".13em",marginBottom:14}}>📌 Biblioteca de templates — clique para carregar no editor</div>
          {TEMPLATES.map(grupo=>(
            <div key={grupo.g} style={{marginBottom:20}}>
              <div style={{fontSize:10,fontWeight:700,color:G,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em",marginBottom:8,borderBottom:`1px solid ${BORDER}`,paddingBottom:5}}>{grupo.g}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
                {grupo.items.map((tpl,i)=>(
                  <div key={i} className="tpl-item" style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"12px 14px",transition:"all .15s"}}
                    onClick={()=>{setTipo(tpl.tipo);setTema(tpl.tema);setTab("editor");setTimeout(()=>taRef.current?.focus(),150);setToast(`Template carregado: ${tpl.l}`);}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                      <span style={{fontSize:20}}>{tpl.ic}</span>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:N}}>{tpl.l}</div>
                        <span style={{fontSize:9,padding:"1px 6px",border:`1px solid ${BORDER}`,borderRadius:10,color:TEXT2,fontFamily:"monospace"}}>{TIPOS_DOC.find(t=>t.id===tpl.tipo)?.l}</span>
                      </div>
                    </div>
                    <div style={{fontSize:11,color:TEXT2,lineHeight:1.6,fontStyle:"italic"}}>{tpl.tema.slice(0,90)}{tpl.tema.length>90?"…":""}</div>
                    <div style={{marginTop:8,fontSize:9,color:G,fontFamily:"monospace"}}>Clique para carregar no Editor →</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ══════════ BIBLIOTECAS ══════════ */}
      {tab==="biblio"&&(
        <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".13em",marginBottom:4}}>Fase 3 — Bibliotecas Jurídicas Integradas</div>
              <div style={{fontSize:14,fontWeight:700,color:N}}>📖 Bases de Dados, Repositórios & IA</div>
              <div style={{fontSize:10,color:TEXT2,marginTop:3}}>CAPES · SciELO · BDTD · STF · STJ · HeinOnline · EUR-Lex e mais 20+ bases</div>
            </div>
            {fontesSalvas.length>0&&<div style={{fontSize:9,padding:"4px 9px",background:`rgba(201,168,76,.12)`,border:`1px solid ${G}40`,color:G,borderRadius:20,fontFamily:"monospace",display:"flex",alignItems:"center",gap:4}}>📌 {fontesSalvas.length} fontes salvas</div>}
          </div>

          {/* Assistente IA */}
          <div style={{background:CARD,border:`2px solid ${G}30`,borderRadius:10,padding:"14px 16px",marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:darkMode?"#1a2744":"#0f1a33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>⚖️</div>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:N}}>Assistente de Pesquisa Jurídica — Claude Sonnet 4</div>
                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace"}}>Streaming · sem chave · integridade acadêmica garantida</div>
              </div>
              <div style={{marginLeft:"auto",fontSize:8,padding:"3px 8px",background:"rgba(34,197,94,.1)",border:"1px solid rgba(34,197,94,.3)",color:darkMode?"#4ade80":"#166534",borderRadius:10,fontFamily:"monospace",fontWeight:700}}>⚖️ CLAUDE ATIVO</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>
              {modosBiblio.map(m=>(
                <button key={m.id} onClick={()=>setBiblioModo(m.id)}
                  style={{padding:"8px 10px",border:`1px solid ${biblioModo===m.id?G:BORDER}`,borderRadius:6,background:biblioModo===m.id?(darkMode?"rgba(201,168,76,.12)":"#fdfaf4"):"transparent",cursor:"pointer",textAlign:"left",transition:"all .12s"}}>
                  <div style={{fontSize:16,marginBottom:3}}>{m.ic}</div>
                  <div style={{fontSize:10,fontWeight:biblioModo===m.id?700:400,color:biblioModo===m.id?(darkMode?G:"#0f1a33"):N,lineHeight:1.2}}>{m.l}</div>
                  <div style={{fontSize:9,color:TEXT2,marginTop:2,lineHeight:1.4}}>{m.desc}</div>
                </button>
              ))}
            </div>
            {biblioModo==="abnt"?(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace",marginBottom:5}}>Cole a referência bruta (qualquer formato) — o Claude formata em ABNT NBR 6023:2018:</div>
                <textarea value={biblioAbntInput} onChange={e=>setBiblioAbntInput(e.target.value)} rows={4}
                  placeholder={"Cole a referência como você encontrou, ex:\nDi Pietro, Maria Sylvia. Direito Administrativo. 36 ed. São Paulo: Atlas, 2023.\n\nOu: STJ. REsp 1.234.567/SP. Rel. Min. Nome. Julgado em 01/01/2024."}
                  style={{width:"100%",padding:"10px 12px",border:`1px solid ${G}40`,fontFamily:"Georgia,serif",fontSize:12,resize:"vertical",outline:"none",borderRadius:6,lineHeight:1.7,background:darkMode?"rgba(201,168,76,.04)":"#fdfaf4",color:N,minHeight:90}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=`${G}40`}
                />
              </div>
            ):(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:9,color:TEXT2,fontFamily:"monospace",marginBottom:5}}>
                  {biblioModo==="mapa"&&"Descreva o tema jurídico para gerar o mapa de pesquisa completo:"}
                  {biblioModo==="verificar"&&"Cole a citação ou referência que deseja verificar:"}
                  {biblioModo==="sintetizar"&&"Descreva o tema para gerar síntese bibliográfica e estado da arte:"}
                </div>
                <input value={biblioTermo} onChange={e=>setBiblioTermo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")pesquisarBiblio();}}
                  placeholder={biblioModo==="mapa"?"Ex: responsabilidade civil do Estado, improbidade administrativa...":biblioModo==="verificar"?"Ex: MELLO, Celso Antônio. Curso de Direito Administrativo. 34. ed...":"Ex: controle de constitucionalidade no Brasil pós-2015"}
                  style={{width:"100%",padding:"9px 12px",border:`1px solid ${BORDER}`,fontFamily:"Georgia,serif",fontSize:12,borderRadius:5,outline:"none",background:CR,color:N}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}
                />
              </div>
            )}
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <button onClick={pesquisarBiblio}
                disabled={biblioLoading||(biblioModo==="abnt"?!biblioAbntInput.trim():!biblioTermo.trim())}
                style={{padding:"9px 20px",background:(biblioLoading||(biblioModo==="abnt"?!biblioAbntInput:!biblioTermo).trim===undefined)?(darkMode?"#1e2d45":"#d4cfc6"):(darkMode?"#1a2744":"#0f1a33"),color:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700,transition:"all .2s"}}>
                {biblioLoading?"⏳ Gerando...":`⚖️ ${modosBiblio.find(m=>m.id===biblioModo)?.l}`}
              </button>
              {(biblioResult||biblioStream)&&(
                <>
                  <button onClick={()=>hCopy(biblioResult||biblioStream,"bib")} style={bOut(cpFb["bib"]?"#22c55e":BORDER,cpFb["bib"]?"#166534":TEXT2)}>{cpFb["bib"]?"✓ Copiado!":"📋 Copiar"}</button>
                  <button onClick={()=>enviarParaEditor(biblioResult||biblioStream)} style={{padding:"5px 12px",background:darkMode?"#1a2744":"#0f1a33",color:"white",border:"none",borderRadius:4,fontSize:11,fontFamily:"monospace",cursor:"pointer"}}>✍️ Usar no Editor →</button>
                  <button onClick={()=>salvarFonte(biblioResult||biblioStream)} style={{padding:"5px 12px",background:"transparent",border:`1px solid ${G}`,color:G,borderRadius:4,fontSize:11,fontFamily:"monospace",cursor:"pointer"}}>📌 Salvar</button>
                  <button onClick={()=>{setBiblioResult("");setBiblioStream("");}} style={{padding:"5px 8px",background:"transparent",border:`1px solid ${BORDER}`,color:TEXT2,borderRadius:4,fontSize:11,cursor:"pointer",fontFamily:"monospace"}}>✕</button>
                </>
              )}
            </div>
            {(biblioStream||biblioResult)&&(
              <div style={{marginTop:14,padding:"14px 16px",background:darkMode?"#0a1628":"#fdfaf4",borderLeft:`3px solid ${G}`,borderRadius:"0 6px 6px 0",fontSize:12,lineHeight:1.9,fontFamily:"Georgia,serif",color:N,maxHeight:400,overflowY:"auto"}}>
                <Linhas text={biblioStream||biblioResult} dark={darkMode}/>
                {biblioLoading&&biblioStream&&<span style={{display:"inline-block",width:8,height:14,background:G,verticalAlign:"middle",animation:"jb .9s infinite",marginLeft:2,borderRadius:2}}/>}
              </div>
            )}
            <div ref={biblioRef}/>
          </div>

          {/* Busca Unificada */}
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"14px 16px",marginBottom:20}}>
            <div style={{fontSize:10,fontWeight:700,color:N,marginBottom:10,display:"flex",alignItems:"center",gap:7}}>
              🔎 <span>Busca Direta nas Bases</span>
              <span style={{fontSize:8,color:TEXT2,fontFamily:"monospace",fontWeight:400}}>Digite e clique no botão da base desejada</span>
            </div>
            <div style={{display:"flex",gap:7,marginBottom:10}}>
              <input value={biblioSearchTerm} onChange={e=>setBiblioSearchTerm(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&biblioSearchTerm.trim()){window.open(`https://scholar.google.com.br/scholar?q=${encodeURIComponent(biblioSearchTerm)}`,"_blank");}}}
                placeholder="Termo de busca — Ex: licitação pública dispensa requisitos"
                style={{flex:1,padding:"8px 12px",border:`1px solid ${BORDER}`,fontFamily:"Georgia,serif",fontSize:12,borderRadius:5,outline:"none",background:CR,color:N}}
                onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}
              />
              <button onClick={()=>setBiblioSearchTerm("")} disabled={!biblioSearchTerm} style={{padding:"8px 11px",border:`1px solid ${BORDER}`,background:"transparent",color:TEXT2,borderRadius:4,cursor:biblioSearchTerm?"pointer":"not-allowed",fontSize:11,opacity:biblioSearchTerm?1:.4}}>✕</button>
            </div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
              <span style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".08em",paddingTop:4}}>Filtrar:</span>
              {["todos",...BIBLIOTECAS.map(b=>b.cat)].map(cat=>(
                <button key={cat} onClick={()=>setBiblioFiltro(cat)}
                  style={{padding:"3px 9px",border:`1px solid ${biblioFiltro===cat?G:BORDER}`,borderRadius:12,background:biblioFiltro===cat?(darkMode?"rgba(201,168,76,.12)":"#fdfaf4"):"transparent",color:biblioFiltro===cat?(darkMode?G:"#0f1a33"):TEXT2,cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:biblioFiltro===cat?700:400,transition:"all .12s",whiteSpace:"nowrap"}}>
                  {cat==="todos"?"Todas":cat.slice(0,18)}
                </button>
              ))}
            </div>
          </div>

          {/* Grid Bases */}
          {BIBLIOTECAS.filter(grp=>biblioFiltro==="todos"||biblioFiltro===grp.cat).map(grp=>(
            <div key={grp.cat} style={{marginBottom:22}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:8,borderBottom:`1px solid ${BORDER}`}}>
                <div style={{width:32,height:32,borderRadius:8,background:`${grp.cor}15`,border:`1px solid ${grp.cor}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>{grp.icCat}</div>
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:grp.cor}}>{grp.cat}</div>
                </div>
                <div style={{marginLeft:"auto",fontSize:9,color:TEXT2,fontFamily:"monospace"}}>{grp.items.length} bases</div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                {grp.items.map((item,i)=>(
                  <div key={i} className="bib-card" style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"11px 13px",transition:"all .15s",position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:grp.cor}}/>
                    <div style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:8,marginTop:4}}>
                      <span style={{fontSize:20,flexShrink:0}}>{item.ic}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:11,fontWeight:700,color:N,lineHeight:1.3,marginBottom:2}}>{item.l}</div>
                        <span style={{fontSize:8,padding:"1px 5px",background:`${grp.cor}12`,border:`1px solid ${grp.cor}30`,color:grp.cor,borderRadius:3,fontFamily:"monospace"}}>{item.tag}</span>
                      </div>
                    </div>
                    <div style={{fontSize:10,color:TEXT2,lineHeight:1.6,marginBottom:10}}>{item.desc}</div>
                    <div style={{display:"flex",gap:5}}>
                      <button className="abrir-btn" onClick={()=>window.open(item.url,"_blank")}
                        style={{flex:1,padding:"5px 8px",border:`1px solid ${BORDER}`,background:"transparent",color:N,borderRadius:4,cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:700,transition:"all .15s"}}>🌐 Abrir</button>
                      <button className="buscar-btn" onClick={()=>{const t=biblioSearchTerm.trim();if(!t){setToast("Digite um termo de busca no campo acima");return;}window.open(item.busca+encodeURIComponent(t),"_blank");}}
                        style={{flex:1,padding:"5px 8px",border:`1px solid ${grp.cor}50`,background:`${grp.cor}08`,color:grp.cor,borderRadius:4,cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:700,transition:"all .15s",opacity:biblioSearchTerm?1:.5}}>🔍 Buscar</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          {/* Fontes Salvas */}
          {fontesSalvas.length>0&&(
            <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:10,padding:"14px 16px",marginTop:8}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:N}}>📌 Fontes Salvas ({fontesSalvas.length})</div>
                <button onClick={()=>{if(window.confirm("Limpar todas as fontes salvas?"))setFontesSalvas([]);}} style={{fontSize:9,padding:"3px 8px",border:"1px solid #fca5a5",background:"transparent",color:"#b91c1c",borderRadius:3,cursor:"pointer",fontFamily:"monospace"}}>🗑 Limpar tudo</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {fontesSalvas.map((f,i)=>(
                  <div key={f.id} style={{padding:"8px 10px",borderRadius:5,border:`1px solid ${BORDER}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                      <div style={{fontSize:11,color:N,lineHeight:1.6,flex:1}}>{f.texto.slice(0,200)}{f.texto.length>200?"…":""}</div>
                      <div style={{display:"flex",gap:4,flexShrink:0}}>
                        <button onClick={()=>hCopy(f.texto,`f${i}`)} style={{padding:"2px 7px",border:`1px solid ${BORDER}`,background:"transparent",color:TEXT2,borderRadius:3,cursor:"pointer",fontSize:9,fontFamily:"monospace"}}>{cpFb[`f${i}`]?"✓":"📋"}</button>
                        <button onClick={()=>enviarParaEditor(f.texto)} style={{padding:"2px 7px",border:"none",background:darkMode?"#1a2744":"#0f1a33",color:"white",borderRadius:3,cursor:"pointer",fontSize:9,fontFamily:"monospace"}}>Editor</button>
                        <button onClick={()=>setFontesSalvas(fs=>fs.filter(x=>x.id!==f.id))} style={{padding:"2px 6px",border:"none",background:"transparent",color:"#b91c1c",cursor:"pointer",fontSize:11}}>✕</button>
                      </div>
                    </div>
                    <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",marginTop:4}}>{f.area} · {new Date(f.ts).toLocaleString("pt-BR")}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{background:darkMode?"rgba(201,168,76,.04)":"rgba(201,168,76,.06)",border:`1px solid ${G}25`,borderRadius:8,padding:"12px 16px",marginTop:16,display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{fontSize:18,flexShrink:0}}>💡</span>
            <div style={{fontSize:11,color:TEXT2,lineHeight:1.7}}>
              <strong style={{color:N}}>Fluxo recomendado:</strong> Use o <strong>Mapa de Pesquisa</strong> para descobrir descritores → busque nas bases → cole resultados como <strong>Contexto</strong> no Editor. Ou use <strong>Importar Doutrina</strong> (botão no Editor) para buscar teses via OAI-PMH e legislação via LexML com citação ABNT automática.
            </div>
          </div>
        </div>
      )}

      {/* ══════════ BUSCA JURISPRUDENCIAL ══════════ */}
      {tab==="busca"&&(
        <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
          <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".13em",marginBottom:12}}>Busca jurídica — STF · STJ · TRFs · TCU · BDjur · LexML · Legislação</div>
          <div style={{display:"flex",gap:7,marginBottom:12}}>
            <input value={bTermo} onChange={e=>setBTermo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")buscar();}}
              placeholder="Ex: responsabilidade civil Estado, licitação inexigível, improbidade..."
              style={{flex:1,padding:"9px 13px",border:`1px solid ${BORDER}`,fontFamily:"Georgia,serif",fontSize:13,borderRadius:5,outline:"none",background:CARD,color:N}}
              onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
            <button onClick={buscar} disabled={bLoad||!bTermo}
              style={{padding:"9px 18px",background:bLoad||!bTermo?(darkMode?"#1e2d45":"#d4cfc6"):(darkMode?"#1a2744":"#0f1a33"),color:"white",border:"none",borderRadius:5,cursor:bLoad||!bTermo?"not-allowed":"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>
              {bLoad?"⏳...":motor==="claude"?"⚖️ Claude":"🔮 Gemini"}
            </button>
          </div>
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"11px 15px",marginBottom:14}}>
            <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".09em",marginBottom:8}}>Abrir diretamente no tribunal:</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {TRIBUNAIS.map(t=>(
                <button key={t.l} className="tb" onClick={()=>bTermo&&window.open(t.url+encodeURIComponent(bTermo),"_blank")} disabled={!bTermo}
                  style={{padding:"5px 11px",border:`1px solid ${N}`,borderRadius:4,background:CARD,color:N,cursor:bTermo?"pointer":"not-allowed",fontSize:10,fontFamily:"monospace",fontWeight:700,opacity:bTermo?1:.3,transition:"all .13s"}}>
                  🔗 {t.l}
                </button>
              ))}
            </div>
          </div>
          {bResult&&(
            <div style={{background:CARD,border:`1px solid ${G}50`,borderLeft:`3px solid ${G}`,borderRadius:4,padding:"14px 18px"}}>
              <div style={{fontSize:8,color:G,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em",marginBottom:10}}>Jurisprudência compilada — Claude Sonnet 4</div>
              <div style={{fontSize:13,lineHeight:1.9,fontFamily:"Georgia,serif"}}><Linhas text={bResult} dark={darkMode}/></div>
              <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
                <button onClick={()=>hCopy(bResult,"b")} style={bOut(cpFb["b"]?"#22c55e":BORDER,cpFb["b"]?"#166534":TEXT2)}>{cpFb["b"]?"✓ Copiado!":"📋 Copiar"}</button>
                <button onClick={()=>exportarMarkdown(bResult,bTermo)} style={bOut(G,G)}>⬇ .md</button>
                <button onClick={()=>{setTema(`Desenvolva texto jurídico completo usando estas jurisprudências:\n\nTema: ${bTermo}`);setProblema(bResult.slice(0,500));setTab("editor");}} style={{padding:"5px 13px",background:darkMode?"#1a2744":"#0f1a33",color:"white",border:"none",borderRadius:4,fontSize:11,fontFamily:"monospace",cursor:"pointer",fontWeight:700}}>✍️ Usar no Editor →</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ══════════ PROJETO ══════════ */}
      {tab==="projeto"&&(
        <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
          <div style={{fontSize:8,color:TEXT2,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".13em",marginBottom:14}}>Configuração do projeto editorial</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
            {[{l:"📖 Nome do livro / tratado",k:"nome",ph:"Ex: Direito Administrativo Contemporâneo — 3ª Edição"},
              {l:"🏛 Área do Direito",k:"area",ph:"Ex: Direito Administrativo, Constitucional..."}].map(f=>(
              <div key={f.k}>
                <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>{f.l}</label>
                <input value={p[f.k]||""} onChange={e=>setProj(pr=>({...pr,[f.k]:e.target.value}))} placeholder={f.ph}
                  style={{width:"100%",padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:12,outline:"none",background:CARD,color:N}}
                  onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
              </div>
            ))}
          </div>
          <div style={{marginBottom:12}}>
            <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>✍️ Autores / referência de estilo</label>
            <input value={p.autores||""} onChange={e=>setProj(pr=>({...pr,autores:e.target.value}))}
              placeholder="Ex: Celso Antônio Bandeira de Mello, Di Pietro, Marinoni..."
              style={{width:"100%",padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:12,outline:"none",background:CARD,color:N}}
              onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor=BORDER}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div>
              <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>✅ Capítulos concluídos (um por linha)</label>
              <textarea value={(p.capsOk||[]).join("\n")} onChange={e=>setProj(pr=>({...pr,capsOk:e.target.value.split("\n").map(l=>l.trim()).filter(Boolean)}))}
                placeholder={"Cap. 1 — Fundamentos\nCap. 2 — Princípios Constitucionais"}
                style={{width:"100%",minHeight:120,padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:11,outline:"none",resize:"vertical",lineHeight:1.7,background:CARD,color:N}}/>
            </div>
            <div>
              <label style={{fontSize:10,fontWeight:700,color:N,display:"block",marginBottom:4}}>⏳ Próximos capítulos (número|título)</label>
              <textarea value={(p.capsProx||[]).map(c=>`${c.num}|${c.titulo}`).join("\n")}
                onChange={e=>setProj(pr=>({...pr,capsProx:e.target.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [n,...r]=l.split("|");return{num:n.trim(),titulo:r.join("|").trim()};}).filter(c=>c.num&&c.titulo)}))}
                placeholder={"3|Licitação — Lei 14.133/2021\n4|Contratos Administrativos"}
                style={{width:"100%",minHeight:120,padding:"7px 10px",border:`1px solid ${BORDER}`,borderRadius:4,fontFamily:"Georgia,serif",fontSize:11,outline:"none",resize:"vertical",lineHeight:1.7,background:CARD,color:N}}/>
            </div>
          </div>
          {totalC>0&&(
            <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:8,padding:"12px 16px",marginTop:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
                <span style={{fontSize:11,fontFamily:"monospace",color:N}}>Progresso do tratado</span>
                <span style={{fontSize:12,fontFamily:"monospace",color:G,fontWeight:700}}>{p.capsOk?.length||0}/{totalC} ({pct}%)</span>
              </div>
              <div style={{height:5,background:BORDER,borderRadius:3,overflow:"hidden",marginBottom:9}}>
                <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#4ade80,#16a34a)",borderRadius:3,transition:"width .6s"}}/>
              </div>
            </div>
          )}
          {/* Fontes importadas no capítulo */}
          {capituloAtivo.doutrina.length>0&&(
            <div style={{background:CARD,border:`1px solid #7c3aed40`,borderRadius:8,padding:"12px 16px",marginTop:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:N}}>📚 Doutrina importada — {capituloAtivo.doutrina.length} fonte{capituloAtivo.doutrina.length!==1?"s":""}</div>
                <button onClick={()=>{if(window.confirm("Limpar todas as fontes importadas?"))setCapituloAtivo({titulo:"Capítulo ativo",doutrina:[]});}} style={{fontSize:9,padding:"3px 8px",border:"1px solid #fca5a5",background:"transparent",color:"#b91c1c",borderRadius:3,cursor:"pointer",fontFamily:"monospace"}}>🗑 Limpar</button>
              </div>
              <div style={{fontSize:11,color:TEXT2,lineHeight:1.8,fontFamily:"monospace",whiteSpace:"pre-wrap",maxHeight:200,overflowY:"auto",fontSize:10}}>
                {gerarBlocoRefDoutrina(capituloAtivo.doutrina)}
              </div>
              <button onClick={()=>hCopy(gerarBlocoRefDoutrina(capituloAtivo.doutrina),"refbloco")} style={{marginTop:8,...bOut(cpFb["refbloco"]?"#22c55e":BORDER,cpFb["refbloco"]?"#166534":TEXT2)}}>{cpFb["refbloco"]?"✓ Copiado!":"📋 Copiar Referências ABNT"}</button>
            </div>
          )}
          <div style={{display:"flex",gap:7,marginTop:16}}>
            <button onClick={()=>{setTipo("sumario");setTema(p.nome||"Tratado Jurídico");setTab("editor");}}
              style={{padding:"7px 16px",background:darkMode?"#1a2744":"#0f1a33",color:G,border:`1px solid ${G}`,borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"monospace",fontWeight:700}}>📋 Gerar Sumário</button>
            <button onClick={()=>{if(window.confirm("Limpar todo o projeto?"))setProj({});}}
              style={{padding:"7px 14px",background:CARD,color:"#b91c1c",border:"1px solid #fca5a5",borderRadius:4,cursor:"pointer",fontSize:12,fontFamily:"monospace"}}>🗑 Limpar</button>
          </div>
        </div>
      )}

      <Toast msg={toast} onClose={()=>setToast("")}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
