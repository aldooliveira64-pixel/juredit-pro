const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}return t;})();

    const nm=s2u(f.name),dt=f.data,cr=crc32(dt),sz=dt.length;

    u32(lh,0,0x04034b50);u16(lh,4,20);u32(lh,14,cr);u32(lh,18,sz);u32(lh,22,sz);u16(lh,26,nm.length);lh.set(nm,30);
    const ce=new Uint8Array(46+nm.length);
    u32(ce,0,0x02014b50);u16(ce,4,20);u16(ce,6,20);u32(ce,16,cr);u32(ce,20,sz);u32(ce,24,sz);u16(ce,28,nm.length);u32(ce,42,off);ce.set(nm,46);

function wPara(runs,o={}){const al=o.center?"center":(o.align||"both");let ind=o.indent?`<w:ind w:firstLine="${o.indent}"/>`:o.indL?`<w:ind w:left="${o.indL}" w:right="${o.indR||0}"/>`:"";const ppr=`<w:pPr><w:spacing w:before="${o.sb||0}" w:after="${o.sa||60}" w:line="${o.lv||276}" w:lineRule="auto"/>${ind}<w:jc w:val="${al}"/></w:pPr>`;return `<w:p>${ppr}${runs.map(r=>wRun(r,o.pt||12)).join("")}</w:p>`;}
const emptyP=()=>`<w:p><w:pPr><w:spacing w:before="0" w:after="60"/></w:pPr></w:p>`;

async function gerarDocx(rawText,nomeLivro,proj){

    if(/^EMENTA_CAP:/i.test(raw)){paras.push(wPara([{text:raw.replace(/^EMENTA_CAP:\s*/i,""),bold:false,italic:true}],{align:"both",pt:10,sa:0,lv:240,indL:1440,indR:1440}));continue;}
    if(raw===raw.toUpperCase()&&/[A-ZÁÉÍÓÚ]{4,}/.test(raw)&&raw.length>4&&!/^\d/.test(raw)&&!/^[①②③]/.test(raw)){paras.push(wPara([{text:raw,bold:true,italic:false}],{center:true,pt:14,sb:0,sa:360,lv:240}));continue;}
    if(/^\*\*[^*]+\*\*$/.test(raw)){paras.push(wPara([{text:raw.replace(/\*\*/g,""),bold:true,italic:false}],{align:"left",pt:12,sb:420,sa:180,lv:276}));continue;}

    if(/^>\s*/.test(raw)){paras.push(wPara(parseInline(raw.replace(/^>\s*/,"")),{align:"both",pt:9,sb:120,sa:120,lv:240,indL:709,indR:709}));continue;}

  const footnotesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:footnotes xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">\n<w:footnote w:type="separator" w:id="-1"><w:p><w:r><w:separator/></w:r></w:p></w:footnote>\n<w:footnote w:type="continuationSeparator" w:id="0"><w:p><w:r><w:continuationSeparator/></w:r></w:p></w:footnote>\n${fnE.map(([id,text])=>`<w:footnote w:id="${id}"><w:p><w:pPr><w:jc w:val="both"/></w:pPr><w:r><w:rPr><w:rStyle w:val="FootnoteReference"/></w:rPr><w:footnoteRef/></w:r><w:r><w:rPr>${FN}<w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr><w:t xml:space="preserve"> ${esc(text)}</w:t></w:r></w:p></w:footnote>`).join("\n")}\n</w:footnotes>`;
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${paras.join("")}<w:sectPr><w:headerReference w:type="default" r:id="rH1"/><w:footerReference w:type="default" r:id="rF1"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1800" w:right="1800" w:bottom="1800" w:left="1800" w:header="708" w:footer="708"/></w:sectPr></w:body></w:document>`;
  const headerXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="right"/><w:pBdr><w:bottom w:val="single" w:sz="4" w:space="4" w:color="888888"/></w:pBdr></w:pPr><w:r><w:rPr><w:i/><w:sz w:val="16"/><w:szCs w:val="16"/>${FN}</w:rPr><w:t>${hTxt}</w:t></w:r></w:p></w:hdr>`;
  const footerXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText> PAGE </w:instrText></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;

  const rR=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footnotes.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footnotes+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const st=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>${FN}<w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:jc w:val="both"/></w:pPr></w:style><w:style w:type="character" w:styleId="FootnoteReference"><w:name w:val="footnote reference"/><w:rPr><w:vertAlign w:val="superscript"/></w:rPr></w:style></w:styles>`;
  const se=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="709"/></w:settings>`;
  const files=[{name:"[Content_Types].xml",data:s2u(ct)},{name:"_rels/.rels",data:s2u(rR)},{name:"word/document.xml",data:s2u(docXml)},{name:"word/styles.xml",data:s2u(st)},{name:"word/settings.xml",data:s2u(se)},{name:"word/header1.xml",data:s2u(headerXml)},{name:"word/footer1.xml",data:s2u(footerXml)},{name:"word/_rels/document.xml.rels",data:s2u(rD)},{name:"word/footnotes.xml",data:s2u(footnotesXml)}];
  const zip=buildZip(files);let bin="";const chunk=8192;for(let i=0;i<zip.length;i+=chunk)bin+=String.fromCharCode(...zip.subarray(i,i+chunk));
  const b64=btoa(bin);const slug=(nomeLivro||"JurEditPro").replace(/[^a-zA-Z0-9]/g,"_").slice(0,28);const fname=slug+"_"+new Date().toISOString().slice(0,10)+".docx";
  const dataUri="data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,"+b64;

// ═══════════════════════════ API CONECTORES — TRIBUNAIS ═══════════════════════════
// Tenta API direta → fallback IA
async function buscarSTF(query) {
  try {
    const url = `https://jurisprudencia.stf.jus.br/pages/search?base=acordaos&query=${encodeURIComponent(query)}&pageSize=5&sort=_score&sortBy=desc`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return null;
    const data = await res.json();
    const hits = data?.hits?.hits || [];
    if (!hits.length) return null;
    return hits.map(h => {
      const s = h._source || {};
      return { tribunal:"STF", processo: s.numeroProcesso||"", relator: s.relator||"", data: s.dataPublicacao||"", ementa: (s.ementa||"").slice(0,300) };
    });
  } catch { return null; }
}

async function buscarTCU(query) {
  try {
    const url = `https://pesquisa.apps.tcu.gov.br/resultado/jurisprudencia/${encodeURIComponent(query)}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000), headers: { Accept:"application/json" } });
    if (!res.ok) return null;
    const data = await res.json();
    const items = data?.result || data?.hits || [];
    if (!items.length) return null;
    return items.slice(0,5).map(i => ({ tribunal:"TCU", processo: i.numero||i.numeroacordao||"", relator: i.relator||"", data: i.data||"", ementa: (i.ementa||i.indexacao||"").slice(0,300) }));
  } catch { return null; }
}

async function buscarBDjur(query) {
  try {
    const url = `https://bdjur.stj.jus.br/jspui/simple-search?query=${encodeURIComponent(query)}&rpp=5&sort_by=score&order=desc&filter_field_1=type&filter_type_1=equals&filter_value_1=Artigo`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return null;
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const items = [...doc.querySelectorAll(".ds-artifact-item, .artifact-title a")].slice(0,5);
    if (!items.length) return null;
    return items.map(el => ({ titulo: el.textContent?.trim()||"", href: el.href||"" }));
  } catch { return null; }
}

async function buscarLexML(query) {
  try {
    const url = `https://www.lexml.gov.br/busca/SRU?operation=searchRetrieve&version=1.1&query=${encodeURIComponent(query)}&maximumRecords=5`;
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!res.ok) return null;
    const xml = await res.text();
    const matches = [...xml.matchAll(/<dc:title[^>]*>([^<]+)<\/dc:title>/gi)].map(m=>m[1].trim());
    const uris = [...xml.matchAll(/<dc:identifier[^>]*>([^<]+)<\/dc:identifier>/gi)].map(m=>m[1].trim());
    return matches.slice(0,5).map((t,i)=>({titulo:t, href:uris[i]||""}));
  } catch { return null; }
}

// ═══════════════════════════ MOTOR IA ═══════════════════════════
async function chamarClaude(messages, system, onStatus) {
  const WAITS=[15,30,60];
  for(let t=0;t<=3;t++){
    if(t>0){for(let s=WAITS[t-1];s>0;s--){onStatus?.(`Aguardando ${s}s (tent.${t+1}/4)...`);await new Promise(r=>setTimeout(r,1000));}}
    onStatus?.(t===0?"⚖️ Claude Sonnet gerando...":"🔄 Tentativa "+(t+1)+"/4...");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:16000,system,messages})});
      if(res.status===529||res.status===503){if(t<3)continue;throw new Error("API sobrecarregada.");}
      if(res.status===429){for(let s=30;s>0;s--){onStatus?.(`Rate limit — ${s}s...`);await new Promise(r=>setTimeout(r,1000));}t--;continue;}
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`Erro ${res.status}: ${e?.error?.message||res.statusText}`);}
      const data=await res.json();
      const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
      if(text){onStatus?.("");return text;}if(t<3)continue;throw new Error("Resposta vazia.");
    }catch(e){if(t===3)throw e;}
  }
}

async function chamarGemini(messages, system, apiKey, onStatus) {
  if(!apiKey?.trim())throw new Error("Cole a chave Gemini nas configurações.");
  const MODELS=["gemini-2.5-flash","gemini-2.5-flash-preview-05-20","gemini-2.0-flash"];
  for(const model of MODELS){
    try{
      onStatus?.(`🔮 Gemini (${model})...`);
      const contents=messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents,systemInstruction:{parts:[{text:system}]},generationConfig:{maxOutputTokens:8192,temperature:0.75}})});
      if(res.status===404)continue;
      if(!res.ok){const e=await res.json().catch(()=>({}));if(res.status===400&&e?.error?.message?.includes("API_KEY"))throw new Error("Chave Gemini inválida.");continue;}
      const data=await res.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"";
      if(text){onStatus?.("");return text;}
    }catch(e){if(e.message.includes("Failed to fetch"))throw new Error("Gemini bloqueado aqui. Use o motor Claude (sem chave).");if(e.message.includes("inválida"))throw e;}
  }
  throw new Error("Nenhum modelo Gemini disponível. Use Claude.");
}

function buildPromptLivro(problema, tema, capNum, area, nivel, proj) {
  const ctx = problema ? `\n══ PROBLEMA / CONTEXTO ══\n${problema}\nEste contexto é o FIO CONDUTOR de todo o desenvolvimento.\n` : "";

}

function buildPromptSumario(obra, area, nivel, descricao) {
  return `Gere SUMÁRIO COMPLETO, DETALHADO E PROFISSIONAL para:\nObra: "${obra}"\nÁrea: ${area} | Nível: ${nivel}\n${descricao ? `\nDescrição: ${descricao}` : ""}\n\nREGRAS:\n• ABNT (1 / 1.1 / 1.1.1)\n• Mínimo 10 capítulos · 5 seções · 3 subseções\n• Títulos REAIS e ESPECÍFICOS ao tema\n• Páginas estimadas: 1.1 Conceito.................15\n• Pré-textuais: Resumo · Abstract · Introdução\n• Pós-textuais: Considerações Finais · Referências\n\nObrigatório ao final:\n\`\`\`CAPITULOS\n1|Título exato\n2|Título exato\n\`\`\``;
}

// Parse capítulos do sumário gerado
function parseCaps(text) {
  const m = text.match(/```CAPITULOS\s*\n([\s\S]*?)```/i);
  if (m) return m[1].split("\n").map(l=>l.trim().match(/^(\d+)\|(.+)/)).filter(Boolean).map(m=>({num:m[1],titulo:m[2].trim()}));
  // fallback: linhas N|título
  return [...text.matchAll(/^(\d{1,2})\|(.{5,})/gm)].map(m=>({num:m[1],titulo:m[2].trim()})).filter((_,i)=>i<20);
}

// Utilitários
async function copiar(text) {
  const c=text.replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1").replace(/\[Fonte:[^\]]+\]/g,"");
  try{await navigator.clipboard.writeText(c);return true;}
  catch{const ta=document.createElement("textarea");ta.value=c;Object.assign(ta.style,{position:"fixed",top:0,left:0,opacity:0,pointerEvents:"none"});document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");document.body.removeChild(ta);return true;}catch{document.body.removeChild(ta);return false;}}
}

const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

// Renderizar linhas com formatação jurídica
function Linhas({text}){
  return (<>{text.split("\n").map((line,i)=>{
    const l=line.trim();
    if(!l)return <div key={i} style={{height:7}}/>;
    if(/^\*\*[^*]+\*\*$/.test(l))return <div key={i} style={{fontWeight:700,color:"#0f1a33",marginTop:16,marginBottom:5,fontSize:13.5,borderLeft:"3px solid #c9a84c",paddingLeft:10}}>{l.replace(/\*\*/g,"")}</div>;
    if(/^>/.test(l))return <div key={i} style={{borderLeft:"4px solid #c9a84c",paddingLeft:14,margin:"10px 0",color:"#3a2800",fontStyle:"italic",fontSize:12,lineHeight:1.75,background:"#fdfaf4",padding:"8px 14px",borderRadius:"0 4px 4px 0"}}>{l.replace(/^>\s*/,"")}</div>;
    if(/^[①②③④⑤]/.test(l))return <div key={i} style={{fontWeight:700,fontSize:11,color:"#8b1a1a",borderBottom:"1px solid #e5e0d8",paddingBottom:4,marginTop:18,marginBottom:7,textTransform:"uppercase",letterSpacing:".06em"}}>{l}</div>;
    if(/^[¹²³⁴⁵⁶⁷⁸⁹]/.test(l)||(/^\d{1,2}[.\s]/.test(l)&&l.length<400))return <div key={i} style={{fontSize:11,color:"#666",lineHeight:1.65,paddingLeft:20,textIndent:"-20px",marginBottom:3}}>{l}</div>;
    if(/^#{1,3}\s/.test(l))return <div key={i} style={{fontWeight:700,color:"#0f1a33",marginTop:16,marginBottom:5,fontSize:13.5}}>{l.replace(/^#+\s/,"")}</div>;
    const segs=l.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/);
    return <p key={i} style={{margin:"0 0 7px",textAlign:"justify",lineHeight:1.9}}>{segs.map((s,j)=>{
      if(/^\*\*[^*]+\*\*$/.test(s))return <strong key={j}>{s.slice(2,-2)}</strong>;
      if(/^\*[^*]+\*$/.test(s))return <em key={j}>{s.slice(1,-1)}</em>;
      return <span key={j}>{s}</span>;
    })}</p>;
  })}</>);
}

      {/* ══════════════ INÍCIO ══════════════ */}
      {tab==="inicio"&&(
        <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
          {motor==="claude"&&<div style={{background:"linear-gradient(135deg,rgba(34,197,94,.08),rgba(201,168,76,.08))",border:"1px solid rgba(34,197,94,.25)",borderRadius:8,padding:"9px 14px",marginBottom:13,display:"flex",gap:9,alignItems:"center"}}>
            <span style={{fontSize:18}}>⚖️</span>
            <div><div style={{fontSize:11,fontWeight:700,color:"#166534"}}>Claude Sonnet 4 ativo — sem nenhuma chave · APIs conectadas: STF · TCU · BDjur · LexML</div>
            <div style={{fontSize:9,color:"#166534"}}>Máxima qualidade jurídica · Sumário integrado com Livro · Protocolo de coleta ativo</div></div>
          </div>}

          {/* KPIs */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7,marginBottom:14}}>

              <div key={i} style={{background:"white",border:"1px solid #e5e0d8",borderRadius:8,padding:"10px 12px"}}>

                <div style={{fontSize:19,fontWeight:700,color:N,lineHeight:1}}>{k.v}</div>
                <div style={{fontSize:9,color:"#aaa",marginTop:2}}>{k.u}</div>
              </div>
            ))}
          </div>

          {/* Config rápida */}
          <div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:8,padding:"9px 13px",marginBottom:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>

            <select style={inp} value={area} onChange={e=>setArea(e.target.value)}>{AREAS.map(a=><option key={a}>{a}</option>)}</select>
            <select style={inp} value={nivel} onChange={e=>setNivel(e.target.value)}>
              <option value="Doutorado e tratados acadêmicos">Doutorado / Tratado</option>
              <option value="Operadores do Direito">Operadores do Direito</option>
              <option value="Mestrado e pós-graduação">Mestrado / Pós-Grad.</option>
              <option value="Graduação avançada">Graduação Avançada</option>
            </select>
            <input value={p.nome} onChange={e=>setProj(pr=>({...pr,nome:e.target.value}))} placeholder="Nome do livro / projeto..." style={{...inp,flex:1,minWidth:130,padding:"6px 9px"}}/>

              <div key={t.id} className="tc" onClick={()=>{setTipo(t.id);setTab("editor");setTimeout(()=>taRef.current?.focus(),80);}}

                <div style={{width:36,height:36,borderRadius:8,background:`${t.cor}15`,border:`1px solid ${t.cor}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,marginBottom:7,marginTop:3}}>{t.ic}</div>
                <div style={{fontSize:11,fontWeight:700,color:tipo===t.id?t.cor:N,marginBottom:2,lineHeight:1.3}}>{t.l}</div>
                <div style={{fontSize:9.5,color:"#8a8278",lineHeight:1.45}}>{t.desc}</div>
              </div>
            ))}
          </div>

          {/* Sumário → disparo rápido */}
          <div style={{background:"white",border:`1px solid ${G}40`,borderRadius:8,padding:"11px 15px",marginBottom:12}}>

            {p.capsProx?.length>0?(
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {p.capsProx.map((c,i)=>(

                    onMouseLeave={e=>{e.currentTarget.style.background="#fdfaf4";e.currentTarget.style.color=N;}}>

                  </button>
                ))}
              </div>
            ):<div style={{fontSize:10,color:"#aaa"}}>Gere um sumário e os capítulos aparecerão aqui como botões de disparo rápido.</div>}
          </div>
        </div>

      {/* ══════════════ SUMÁRIO ══════════════ */}
      {tab==="sumario"&&(
        <div style={{flex:1,display:"flex",gap:0,overflow:"hidden"}}>

              <label style={lblSty}>📖 Título do livro / obra *</label>

            </div>
            <div style={{marginBottom:11}}>
              <label style={lblSty}>📝 Descrição / problema central</label>
              <textarea value={sumDesc} onChange={e=>setSumDesc(e.target.value)} rows={4}

                style={{...inpSty,resize:"none",lineHeight:1.65}}
                onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
            </div>
            <button onClick={gerarSumario} disabled={!sumTitulo||!!sumLoading.startsWith("Ger")}

            {sumLoading&&<div style={{fontSize:10,color:sumLoading.startsWith("✅")?"#166534":sumLoading.startsWith("⚠")?"#991b1b":"#666",fontFamily:"monospace",marginBottom:8,padding:"6px 10px",background:sumLoading.startsWith("✅")?"#f0fdf4":sumLoading.startsWith("⚠")?"#fef2f2":"#eff6ff",borderRadius:4}}>{sumLoading}</div>}

              <div>
                <div style={{fontSize:9,color:"#166534",fontFamily:"monospace",marginBottom:7,fontWeight:700}}>✅ {sumCaps.length} capítulos extraídos</div>

                  style={{width:"100%",padding:"8px",background:"#166534",color:"white",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700,marginBottom:8}}>
                  🔗 Integrar ao Projeto → botões de disparo
                </button>
                <div style={{fontSize:9,color:"#8a8278",fontFamily:"monospace",marginBottom:6}}>ou gere cada capítulo individualmente →</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {sumCaps.map((c,i)=>(
                    <button key={i} onClick={()=>gerarCapDeSumario(c)}
                      style={{padding:"6px 10px",background:"#fdfaf4",border:`1px solid ${G}`,borderRadius:4,cursor:"pointer",fontSize:10,color:N,fontFamily:"monospace",textAlign:"left",transition:"all .15s"}}
                      onMouseEnter={e=>{e.currentTarget.style.background=G;e.currentTarget.style.color="white";}}
                      onMouseLeave={e=>{e.currentTarget.style.background="#fdfaf4";e.currentTarget.style.color=N;}}>
                      ▶ Cap.{c.num} — {c.titulo.slice(0,36)}{c.titulo.length>36?"…":""}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
          {/* Painel direito — sumário gerado */}
          <div style={{flex:1,overflowY:"auto",padding:"16px 20px",background:"#fdfaf4"}}>
            {!sumTexto?(
              <div style={{textAlign:"center",padding:"60px 20px",color:"#8a8278"}}>
                <div style={{fontSize:48,marginBottom:12}}>📋</div>
                <div style={{fontSize:13,color:N,fontWeight:700,marginBottom:6}}>Sumário integrado ao Livro</div>
                <div style={{fontSize:11,lineHeight:1.8,maxWidth:380,margin:"0 auto"}}>Preencha o título e descrição ao lado. O sistema gera o sumário completo, extrai os capítulos automaticamente e cria botões de disparo para gerar cada um com 1 clique.</div>
              </div>
            ):(
              <div>
                <div style={{display:"flex",gap:7,marginBottom:12,flexWrap:"wrap"}}>
                  <button onClick={()=>hCopy(sumTexto,"sum")} style={bOut(cpFb["sum"]?"#22c55e":"#d4cfc6",cpFb["sum"]?"#166534":"#555")}>{cpFb["sum"]?"✓ Copiado!":"📋 Copiar"}</button>
                  <button onClick={()=>gerarDocx(sumTexto,sumTitulo,p)} style={{...bOut("#8b1a1a","#8b1a1a"),background:"white"}}>⬇ .docx</button>
                  <button onClick={()=>{setSumTexto("");setSumCaps([]);setSumLoading("");}} style={bOut()}>🔄 Novo</button>
                </div>
                <pre style={{whiteSpace:"pre-wrap",fontFamily:"Georgia,serif",fontSize:12.5,lineHeight:1.9,color:"#0f0e0c"}}>{sumTexto}</pre>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ══════════════ EDITOR ══════════════ */}
      {tab==="editor"&&(
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

            <span style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".09em",whiteSpace:"nowrap"}}>Tipo:</span>
            {TIPOS_DOC.map(t=>(
              <button key={t.id} onClick={()=>setTipo(t.id)}
                style={{padding:"3px 9px",border:`1px solid ${tipo===t.id?t.cor:"#d4cfc6"}`,borderRadius:12,background:tipo===t.id?`${t.cor}12`:"transparent",color:tipo===t.id?t.cor:"#8a8278",cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:tipo===t.id?700:400}}>
                {t.ic} {t.l}
              </button>
            ))}
          </div>
          {/* Chat */}
          <div style={{flex:1,overflowY:"auto",padding:"13px 18px",display:"flex",flexDirection:"column",gap:12}}>
            {msgs.length===0&&<div style={{textAlign:"center",padding:"40px 16px",color:"#8a8278"}}>
              <div style={{fontSize:42,marginBottom:9}}>✍️</div>

            </div>}

              <div key={i} style={{animation:"jup .2s ease"}}>
                {m.role==="user"
                  ?<div style={{display:"flex",justifyContent:"flex-end"}}><div style={{maxWidth:"78%",padding:"8px 14px",background:N,color:"rgba(255,255,255,.88)",borderRadius:7,fontSize:12,lineHeight:1.7}}>{m.text}</div></div>
                  :<div>
                    <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
                      <span style={{fontSize:8,padding:"2px 6px",background:m.motor==="gemini"?"rgba(96,165,250,.1)":"rgba(201,168,76,.12)",border:`1px solid ${m.motor==="gemini"?"rgba(96,165,250,.3)":"rgba(201,168,76,.3)"}`,color:m.motor==="gemini"?"#1d4ed8":"#92400e",borderRadius:10,fontFamily:"monospace",fontWeight:700}}>{m.motor==="gemini"?"🔮 Gemini":"⚖️ Claude"}</span>
                    </div>
                    <div style={{padding:"13px 17px",background:"white",borderLeft:`3px solid ${G}`,borderRadius:4,fontSize:13,lineHeight:1.9,fontFamily:"Georgia,serif",boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>
                      <Linhas text={m.text}/>
                    </div>
                    <div style={{display:"flex",gap:5,marginTop:6,flexWrap:"wrap"}}>
                      <button onClick={()=>gerarDocx(m.text,p.nome,p)} style={{padding:"4px 12px",background:"#8b1a1a",color:"white",border:"none",borderRadius:4,fontSize:10,fontFamily:"monospace",cursor:"pointer",fontWeight:700}}>⬇ .docx</button>
                      <button onClick={()=>hCopy(m.text,i)} style={bOut(cpFb[i]?"#22c55e":"#d4cfc6",cpFb[i]?"#166534":"#555")}>{cpFb[i]?"✓ Copiado!":"📋 Copiar"}</button>
                      <button onClick={()=>send(`Continue EXATAMENTE de onde parou:\n\n${m.text.slice(-280)}`)} style={bOut()}>▶ Continuar</button>
                      <button onClick={()=>send(`Revise preservando estilo, corrija ABNT:\n\n${m.text}`)} style={bOut()}>🔍 Revisar</button>
                      <button onClick={()=>{window.open("https://docs.new","_blank");hCopy(m.text,"d");}} style={bOut("#34a853","#166534")}>📝 Docs</button>
                    </div>
                  </div>}
              </div>
            ))}
            {loading&&<div style={{display:"flex",gap:8,alignItems:"center",padding:"11px 15px",background:"white",borderLeft:`3px solid ${G}`,borderRadius:4,boxShadow:"0 1px 7px rgba(0,0,0,.07)"}}>
              <div style={{display:"flex",gap:4}}>{[0,.2,.4].map((d,j)=><div key={j} style={{width:6,height:6,borderRadius:"50%",background:G,animation:`jb 1.2s ${d}s infinite`}}/>)}</div>
              <span style={{fontSize:10,color:"#8a8278",fontFamily:"monospace",flex:1}}>{status||(motor==="claude"?"⚖️ Claude Sonnet gerando...":"🔮 Gemini gerando...")}</span>
              <button onClick={()=>{setLoading(false);setStatus("");}} style={{padding:"3px 9px",background:"#991b1b",border:"none",borderRadius:3,color:"white",fontSize:9,fontFamily:"monospace",cursor:"pointer"}}>✕ Cancelar</button>
            </div>}
            <div ref={botRef}/>
          </div>
          {/* Input */}
          <div style={{background:"white",borderTop:"1px solid #d4cfc6",padding:"10px 14px",flexShrink:0}}>
            <div style={{marginBottom:7}}>
              <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".09em",marginBottom:3}}>📌 Problema / contexto (alimenta o desenvolvimento)</div>
              <textarea value={problema} onChange={e=>setProblema(e.target.value)} rows={2}
                placeholder="Descreva o problema jurídico, caso concreto ou questão-problema que o texto deve responder..."
                style={{width:"100%",padding:"7px 11px",border:`1px solid ${G}40`,fontFamily:"Georgia,serif",fontSize:11,resize:"none",outline:"none",borderRadius:5,lineHeight:1.6,background:"#fdfaf4",transition:"all .2s"}}
                onFocus={e=>{e.target.style.borderColor=G;e.target.style.background="white";}}
                onBlur={e=>{e.target.style.borderColor=`${G}40`;e.target.style.background="#fdfaf4";}}/>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
              <div style={{flex:1}}>
                <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".09em",marginBottom:3}}>Tema / título ({TIPOS_DOC.find(t=>t.id===tipo)?.l})</div>
                <textarea ref={taRef} rows={2} value={tema} onChange={e=>setTema(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
                  placeholder="Ex: Licitação inexigível — Lei 14.133/2021..."
                  style={{width:"100%",padding:"7px 11px",border:"1px solid #d4cfc6",fontFamily:"Georgia,serif",fontSize:13,resize:"none",outline:"none",borderRadius:5,lineHeight:1.6,background:CR,transition:"all .2s"}}
                  onFocus={e=>{e.target.style.borderColor=G;e.target.style.background="white";}}
                  onBlur={e=>{e.target.style.borderColor="#d4cfc6";e.target.style.background=CR;}}/>
              </div>
              <button onClick={()=>send()} disabled={loading||!tema.trim()}
                style={{width:42,height:42,background:(loading||!tema.trim())?"#d4cfc6":N,border:"none",borderRadius:5,cursor:(loading||!tema.trim())?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}
                onMouseEnter={e=>{if(!loading&&tema.trim())e.currentTarget.style.background="#8b1a1a";}}
                onMouseLeave={e=>{if(!loading&&tema.trim())e.currentTarget.style.background=N;}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              </button>
            </div>
            <div style={{display:"flex",gap:4,marginTop:6,flexWrap:"wrap"}}>

                  style={{fontSize:9,fontFamily:"monospace",padding:"3px 7px",border:"1px solid #d4cfc6",background:"transparent",color:"#8a8278",cursor:"pointer",borderRadius:3}}>{a}</button>
              ))}
              {msgs.length>0&&<button onClick={()=>{setMsgs([]);setHist([]);}} style={{fontSize:9,fontFamily:"monospace",padding:"3px 7px",border:"1px solid #fca5a5",background:"transparent",color:"#b91c1c",cursor:"pointer",borderRadius:3,marginLeft:"auto"}}>🗑 Limpar</button>}
            </div>
          </div>
        </div>

        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* Sub-tabs */}
          <div style={{background:"white",borderBottom:"1px solid #e5e0d8",padding:"0 16px",display:"flex",gap:0,flexShrink:0}}>
            {[{id:"juris",l:"⚖️ Jurisprudência · API"},{id:"biblioteca",l:"📚 Biblioteca Jurídica"},{id:"coleta",l:"📊 Protocolo de Coleta"}].map(t=>(
              <button key={t.id} onClick={()=>setBTab(t.id)}
                style={{padding:"7px 14px",border:"none",borderBottom:`2px solid ${bTab===t.id?G:"transparent"}`,background:"white",cursor:"pointer",fontSize:10.5,color:bTab===t.id?N:"#8a8278",fontFamily:"monospace",fontWeight:bTab===t.id?700:400,marginBottom:-1}}>
                {t.l}
              </button>
            ))}
          </div>

          {/* ── JURISPRUDÊNCIA ── */}
          {bTab==="juris"&&<div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
            <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".12em",marginBottom:11}}>
              API CONECTORES DIRETOS: STF · TCU · STJ · TRFs · TJDFT + Análise por IA
            </div>
            <div style={{display:"flex",gap:7,marginBottom:12}}>
              <input value={bTermo} onChange={e=>setBTermo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")buscarJuris();}}
                placeholder="Ex: responsabilidade civil Estado, licitação inexigível, poder de polícia, improbidade..."
                style={{flex:1,padding:"9px 12px",border:"1px solid #d4cfc6",fontFamily:"Georgia,serif",fontSize:12.5,borderRadius:5,outline:"none",background:"white"}}
                onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
              <button onClick={buscarJuris} disabled={bLoad||!bTermo}
                style={{padding:"9px 16px",background:bLoad||!bTermo?"#d4cfc6":N,color:"white",border:"none",borderRadius:5,cursor:bLoad||!bTermo?"not-allowed":"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>
                {bLoad?"⏳...":"🔎 Buscar"}
              </button>
            </div>

            {/* Status das APIs */}
            <div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:8,padding:"10px 14px",marginBottom:13}}>
              <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".09em",marginBottom:8}}>CONEXÃO DIRETA — Abre portal oficial (nova aba):</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {APIS_TRIBUNAIS.map(t=>(
                  <button key={t.id} className="tb" onClick={()=>bTermo&&window.open(t.url+encodeURIComponent(bTermo),"_blank")} disabled={!bTermo}
                    style={{padding:"4px 11px",border:`1px solid ${t.cor}`,borderRadius:4,background:"white",color:t.cor,cursor:bTermo?"pointer":"not-allowed",fontSize:10,fontFamily:"monospace",fontWeight:700,opacity:bTermo?1:.3,transition:"all .13s",display:"flex",alignItems:"center",gap:4}}>
                    {t.fn&&<div style={{width:5,height:5,borderRadius:"50%",background:t.cor,animation:bTermo?"pulse 2s infinite":"none"}}/>}
                    {t.l}{t.fn&&" ⚡"}
                  </button>
                ))}
              </div>
              <div style={{fontSize:8,color:"#aaa",marginTop:6,fontFamily:"monospace"}}>⚡ = API direta disponível (STF · TCU) · Os demais abrem o portal oficial</div>
            </div>

            {/* Resultados API direta */}
            {Object.keys(bApi).length>0&&(
              <div style={{marginBottom:13}}>
                {Object.entries(bApi).map(([tid,results])=>(
                  <div key={tid} style={{background:"white",border:"1px solid #e5e0d8",borderRadius:8,padding:"11px 14px",marginBottom:8}}>
                    <div style={{fontSize:9,color:APIS_TRIBUNAIS.find(t=>t.id===tid)?.cor||N,fontFamily:"monospace",textTransform:"uppercase",fontWeight:700,marginBottom:8}}>⚡ API {tid.toUpperCase()} — {results.length} resultado(s) direto(s)</div>
                    {results.map((r,i)=>(
                      <div key={i} style={{padding:"8px 0",borderBottom:i<results.length-1?"1px solid #f0ede8":"none"}}>
                        {r.processo&&<div style={{fontSize:10,fontFamily:"monospace",color:N,fontWeight:700}}>{r.tribunal} · {r.processo} · {r.relator} · {r.data}</div>}
                        {r.titulo&&<div style={{fontSize:10,fontFamily:"monospace",color:N,fontWeight:700}}>{r.titulo}</div>}
                        <div style={{fontSize:11,color:"#444",lineHeight:1.6,marginTop:3}}>{r.ementa||""}</div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}

            {/* Resultado IA */}
            {bResult&&<div style={{background:"white",border:`1px solid ${G}50`,borderLeft:`3px solid ${G}`,borderRadius:4,padding:"13px 17px"}}>
              <div style={{fontSize:8,color:G,fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em",marginBottom:9}}>Análise por {motor==="claude"?"Claude Sonnet":"Gemini"}</div>
              <div style={{fontSize:13,lineHeight:1.9,fontFamily:"Georgia,serif"}}><Linhas text={bResult}/></div>
              <div style={{display:"flex",gap:6,marginTop:11,flexWrap:"wrap"}}>
                <button onClick={()=>hCopy(bResult,"bj")} style={bOut(cpFb["bj"]?"#22c55e":"#d4cfc6",cpFb["bj"]?"#166534":"#555")}>{cpFb["bj"]?"✓ Copiado!":"📋 Copiar"}</button>
                <button onClick={()=>{setTema(`Texto completo sobre ${bTermo}`);setProblema(bResult.slice(0,500));setTab("editor");}} style={{padding:"4px 12px",background:N,color:"white",border:"none",borderRadius:4,fontSize:10,fontFamily:"monospace",cursor:"pointer",fontWeight:700}}>✍️ Usar no Editor →</button>
              </div>
            </div>}
          </div>}

          {/* ── BIBLIOTECA JURÍDICA ── */}
          {bTab==="biblioteca"&&<div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
            <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".12em",marginBottom:11}}>
              BIBLIOTECA JURÍDICA DIGITAL — BDjur (STJ) · LexML Brasil · CAPES · Planalto
            </div>
            <div style={{display:"flex",gap:7,marginBottom:14}}>
              <input value={bTermo} onChange={e=>setBTermo(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")buscarBiblioteca();}}
                placeholder="Ex: responsabilidade civil, controle de constitucionalidade, improbidade administrativa..."
                style={{flex:1,padding:"9px 12px",border:"1px solid #d4cfc6",fontFamily:"Georgia,serif",fontSize:12.5,borderRadius:5,outline:"none",background:"white"}}
                onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
              <button onClick={buscarBiblioteca} disabled={bibLoad||!bTermo}
                style={{padding:"9px 16px",background:bibLoad||!bTermo?"#d4cfc6":"#7c3aed",color:"white",border:"none",borderRadius:5,cursor:bibLoad||!bTermo?"not-allowed":"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>
                {bibLoad?"⏳...":"📚 Buscar"}
              </button>
            </div>

            {/* Links diretos às bibliotecas */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:9,marginBottom:14}}>
              {[
                {ic:"📕",l:"BDjur — STJ",desc:"Biblioteca Digital Jurídica do STJ",cor:"#7c3aed",url:`https://bdjur.stj.jus.br/jspui/simple-search?query=${encodeURIComponent(bTermo||"direito")}`},
                {ic:"📗",l:"LexML Brasil",desc:"Normas e jurisprudência sistematizadas",cor:"#0369a1",url:`https://www.lexml.gov.br/busca/find?query=${encodeURIComponent(bTermo||"direito")}`},
                {ic:"📘",l:"CAPES Periódicos",desc:"Artigos científicos e teses",cor:"#0f766e",url:`https://www.periodicos.capes.gov.br/index.php?option=com_pcollection&mn=70&smn=79&q=${encodeURIComponent(bTermo||"direito")}`},
                {ic:"📙",l:"Planalto — Legislação",desc:"Leis, decretos e normas vigentes",cor:"#b45309",url:`https://www.planalto.gov.br/busca/?q=${encodeURIComponent(bTermo||"direito")}`},
                {ic:"📓",l:"Portal STF",desc:"Jurisprudência e legislação STF",cor:"#1d4ed8",url:`https://portal.stf.jus.br/jurisprudencia/pesquisar.asp?s1=${encodeURIComponent(bTermo||"direito")}`},
                {ic:"📔",l:"TJDFT — Jurisprudência",desc:"Tribunal de Justiça do Distrito Federal",cor:"#c2410c",url:`https://pesquisajuris.tjdft.jus.br/IndexadorAcordaos-web/sistj?visaoId=tjdf.sistj.acordaoeletronico.buscaindexada.apresentacao.VisaoBuscaAcordaoGet&nomePagina=buscaLivre&internet=1&parametros.baseSelecionada=BASE_ACORDAO_TODAS&parametros.texto=${encodeURIComponent(bTermo||"direito")}`},
              ].map((b,i)=>(
                <a key={i} href={b.url} target="_blank" rel="noreferrer"
                  style={{display:"flex",gap:10,alignItems:"center",padding:"11px 13px",background:"white",border:`1px solid ${b.cor}30`,borderLeft:`3px solid ${b.cor}`,borderRadius:6,textDecoration:"none",transition:"all .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.background=`${b.cor}08`}
                  onMouseLeave={e=>e.currentTarget.style.background="white"}>
                  <span style={{fontSize:22,flexShrink:0}}>{b.ic}</span>
                  <div>
                    <div style={{fontSize:11,fontWeight:700,color:b.cor}}>{b.l} ↗</div>
                    <div style={{fontSize:9.5,color:"#8a8278"}}>{b.desc}</div>
                  </div>
                </a>
              ))}
            </div>

            {/* Resultados BDjur */}
            {bibResult.bdjur?.length>0&&(
              <div style={{background:"white",border:"1px solid #7c3aed30",borderLeft:"3px solid #7c3aed",borderRadius:4,padding:"11px 15px",marginBottom:10}}>
                <div style={{fontSize:8,color:"#7c3aed",fontFamily:"monospace",textTransform:"uppercase",fontWeight:700,marginBottom:8}}>📕 BDjur — {bibResult.bdjur.length} artigo(s) encontrado(s)</div>
                {bibResult.bdjur.map((item,i)=>(
                  <div key={i} style={{padding:"6px 0",borderBottom:i<bibResult.bdjur.length-1?"1px solid #f0ede8":"none"}}>
                    {item.href?<a href={item.href} target="_blank" rel="noreferrer" style={{fontSize:11,color:"#7c3aed",textDecoration:"none",lineHeight:1.6}}>{item.titulo} ↗</a>
                    :<div style={{fontSize:11,color:N,lineHeight:1.6}}>{item.titulo}</div>}
                  </div>
                ))}
              </div>
            )}

            {/* Resultados LexML */}
            {bibResult.lexml?.length>0&&(
              <div style={{background:"white",border:"1px solid #0369a130",borderLeft:"3px solid #0369a1",borderRadius:4,padding:"11px 15px"}}>
                <div style={{fontSize:8,color:"#0369a1",fontFamily:"monospace",textTransform:"uppercase",fontWeight:700,marginBottom:8}}>📗 LexML — {bibResult.lexml.length} norma(s) encontrada(s)</div>
                {bibResult.lexml.map((item,i)=>(
                  <div key={i} style={{padding:"6px 0",borderBottom:i<bibResult.lexml.length-1?"1px solid #f0ede8":"none"}}>
                    {item.href?<a href={item.href} target="_blank" rel="noreferrer" style={{fontSize:11,color:"#0369a1",textDecoration:"none",lineHeight:1.6}}>{item.titulo} ↗</a>
                    :<div style={{fontSize:11,color:N,lineHeight:1.6}}>{item.titulo}</div>}
                  </div>
                ))}
              </div>
            )}

            {bibLoad&&<div style={{textAlign:"center",padding:"20px",color:"#8a8278",fontSize:11,fontFamily:"monospace"}}>⏳ Consultando BDjur e LexML...</div>}
          </div>}

          {/* ── PROTOCOLO DE COLETA ── */}
          {bTab==="coleta"&&<div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
            <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".12em",marginBottom:14}}>
              📊 PROTOCOLO DE COLETA DE DADOS JURÍDICOS
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[
                {l:"🎯 Tema / objeto da pesquisa",k:"tema",ph:"Ex: Responsabilidade civil do Estado por atos omissivos"},
                {l:"📚 Fontes primárias consultadas",k:"fonte",ph:"Ex: STF, STJ, TCU, doutrina Di Pietro..."},
              ].map(f=>(
                <div key={f.k}>
                  <label style={lblSty}>{f.l}</label>
                  <input value={coleta[f.k]} onChange={e=>setColeta(c=>({...c,[f.k]:e.target.value}))} placeholder={f.ph}
                    style={inpSty} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[
                {l:"🔬 Hipótese / questão-problema",k:"hipotese",rows:3,ph:"Qual é a tese a ser comprovada ou refutada?"},
                {l:"🧮 Método utilizado",k:"metodo",rows:3,ph:"Ex: Análise dogmática, jurisprudencial, comparativa..."},
              ].map(f=>(
                <div key={f.k}>
                  <label style={lblSty}>{f.l}</label>
                  <textarea value={coleta[f.k]} onChange={e=>setColeta(c=>({...c,[f.k]:e.target.value}))} placeholder={f.ph} rows={f.rows}
                    style={{...inpSty,resize:"vertical",lineHeight:1.65}}
                    onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
                </div>
              ))}
            </div>
            <div style={{marginBottom:12}}>
              <label style={lblSty}>📝 Achados / resultados da pesquisa</label>
              <textarea value={coleta.achados} onChange={e=>setColeta(c=>({...c,achados:e.target.value}))} rows={5}
                placeholder="Cole aqui os fragmentos de jurisprudência, doutrina e legislação coletados..."
                style={{...inpSty,resize:"vertical",lineHeight:1.7}}
                onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
            </div>
            <div style={{marginBottom:14}}>
              <label style={lblSty}>💡 Observações e notas de análise</label>
              <textarea value={coleta.obs} onChange={e=>setColeta(c=>({...c,obs:e.target.value}))} rows={3}
                placeholder="Anotações, discordâncias, pontos para aprofundar..."
                style={{...inpSty,resize:"vertical",lineHeight:1.65}}
                onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={()=>{
                if(!coleta.tema) return;
                const texto = `PROTOCOLO DE COLETA — ${coleta.tema}\n\nFontes: ${coleta.fonte}\nHipótese: ${coleta.hipotese}\nMétodo: ${coleta.metodo}\n\nAchados:\n${coleta.achados}\n\nObservações:\n${coleta.obs}`;
                setProblema(texto.slice(0,800));
                setTema(coleta.tema);
                setTab("editor");
              }} style={{padding:"8px 16px",background:N,color:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>
                ✍️ Usar no Editor →
              </button>
              <button onClick={()=>hCopy(JSON.stringify(coleta,null,2),"col")} style={bOut(cpFb["col"]?"#22c55e":"#d4cfc6",cpFb["col"]?"#166534":"#555")}>
                {cpFb["col"]?"✓ Copiado!":"📋 Copiar protocolo"}
              </button>
              <button onClick={()=>{if(window.confirm("Limpar protocolo?"))setColeta({tema:"",fonte:"",hipotese:"",metodo:"",achados:"",obs:"",});}}
                style={{padding:"8px 12px",background:"white",color:"#b91c1c",border:"1px solid #fca5a5",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>
                🗑 Limpar
              </button>
              <div style={{fontSize:9,color:"#8a8278",fontFamily:"monospace",marginLeft:"auto",alignSelf:"center"}}>
                ✅ Salvo automaticamente no navegador
              </div>
            </div>
          </div>}
        </div>
      )}

      {/* ══════════════ PROJETO ══════════════ */}
      {tab==="projeto"&&(
        <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
          <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".12em",marginBottom:13}}>Configuração do projeto editorial</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:11}}>
            {[{l:"📖 Nome do livro / tratado",k:"nome",ph:"Ex: Direito Administrativo Contemporâneo"},{l:"🏛 Área do Direito",k:"area",ph:"Ex: Direito Administrativo..."}].map(f=>(
              <div key={f.k}>
                <label style={lblSty}>{f.l}</label>
                <input value={p[f.k]||""} onChange={e=>setProj(pr=>({...pr,[f.k]:e.target.value}))} placeholder={f.ph}
                  style={inpSty} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
              </div>
            ))}
          </div>
          <div style={{marginBottom:11}}>
            <label style={lblSty}>✍️ Autores / referência de estilo</label>
            <input value={p.autores||""} onChange={e=>setProj(pr=>({...pr,autores:e.target.value}))} placeholder="Ex: Celso Antônio Bandeira de Mello, Di Pietro, Marinoni..."
              style={inpSty} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}}>
            <div>
              <label style={lblSty}>✅ Capítulos concluídos (um por linha)</label>
              <textarea value={(p.capsOk||[]).join("\n")} onChange={e=>setProj(pr=>({...pr,capsOk:e.target.value.split("\n").map(l=>l.trim()).filter(Boolean)}))}
                placeholder={"Cap. 1 — Fundamentos\nCap. 2 — Princípios"}
                style={{...inpSty,minHeight:110,resize:"vertical",lineHeight:1.7}}/>
            </div>
            <div>
              <label style={lblSty}>⏳ Próximos capítulos (num|título)</label>
              <textarea value={(p.capsProx||[]).map(c=>`${c.num}|${c.titulo}`).join("\n")}
                onChange={e=>setProj(pr=>({...pr,capsProx:e.target.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[n,...r]=l.split("|");return{num:n.trim(),titulo:r.join("|").trim()};}).filter(c=>c.num&&c.titulo)}))}
                placeholder={"3|Licitação — Lei 14.133/2021\n4|Contratos Administrativos"}
                style={{...inpSty,minHeight:110,resize:"vertical",lineHeight:1.7}}/>
              <div style={{fontSize:8,color:"#aaa",fontFamily:"monospace",marginTop:3}}>num|título → botões de disparo na aba Início</div>
            </div>
          </div>
          {totalC>0&&<div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:8,padding:"11px 14px",marginTop:13}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:10,fontFamily:"monospace",color:N}}>Progresso do tratado</span>
              <span style={{fontSize:11,fontFamily:"monospace",color:G,fontWeight:700}}>{p.capsOk?.length||0}/{totalC} ({pct}%)</span>
            </div>
            <div style={{height:5,background:"#e5e0d8",borderRadius:3,overflow:"hidden",marginBottom:8}}>
              <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#4ade80,#16a34a)",borderRadius:3}}/>
            </div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {(p.capsOk||[]).map((c,i)=>(
                <span key={i} style={{fontSize:8,padding:"2px 6px",background:"rgba(34,197,94,.1)",border:"1px solid rgba(34,197,94,.3)",color:"#166534",borderRadius:3,fontFamily:"monospace"}}>✓ {c.split("—")[0].trim()}</span>
              ))}
            </div>
          </div>}
          <div style={{display:"flex",gap:7,marginTop:14,flexWrap:"wrap"}}>
            <button onClick={()=>setTab("sumario")} style={{padding:"7px 15px",background:N,color:G,border:`1px solid ${G}`,borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>📋 Gerar Sumário</button>
            <button onClick={()=>{setTipo("livro");setTab("editor");setTimeout(()=>taRef.current?.focus(),100);}} style={{padding:"7px 14px",background:"white",color:N,border:`1px solid ${N}`,borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>✍️ Novo Capítulo</button>
            <button onClick={()=>{if(window.confirm("Limpar todo o projeto?"))setProj({});}} style={{padding:"7px 13px",background:"white",color:"#b91c1c",border:"1px solid #fca5a5",borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>🗑 Limpar</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
