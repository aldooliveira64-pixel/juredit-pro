// 1.2 — INDEXEDDB (banco local) + SUPABASE (opcional, nuvem)
// ═══════════════════════════════════════════════════════════
const DB_NAME = "JurEditProV4";
const DB_VER  = 1;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onerror = () => rej(req.error);
    req.onsuccess = () => res(req.result);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("projects")) {
        db.createObjectStore("projects", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("chapters")) {
        const cs = db.createObjectStore("chapters", { keyPath: "id" });
        cs.createIndex("project_id", "project_id", { unique: false });
      }
    };
  });
}
async function dbPut(store, data) {
  const db = await openDB();
  return new Promise((res,rej)=>{ const tx=db.transaction(store,"readwrite"); const req=tx.objectStore(store).put(data); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
}
async function dbGet(store, id) {
  const db = await openDB();
  return new Promise((res,rej)=>{ const tx=db.transaction(store,"readonly"); const req=tx.objectStore(store).get(id); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
}
async function dbGetAll(store) {
  const db = await openDB();
  return new Promise((res,rej)=>{ const tx=db.transaction(store,"readonly"); const req=tx.objectStore(store).getAll(); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>rej(req.error); });
}
async function dbGetByIndex(store, idx, val) {
  const db = await openDB();
  return new Promise((res,rej)=>{ const tx=db.transaction(store,"readonly"); const req=tx.objectStore(store).index(idx).getAll(val); req.onsuccess=()=>res(req.result||[]); req.onerror=()=>rej(req.error); });
}
async function dbDelete(store, id) {
  const db = await openDB();
  return new Promise((res,rej)=>{ const tx=db.transaction(store,"readwrite"); const req=tx.objectStore(store).delete(id); req.onsuccess=()=>res(); req.onerror=()=>rej(req.error); });
}

// Supabase opcional (Item 1.2 cloud)
async function supabasePut(url, key, table, data) {
  if (!url || !key) return false;
  try {
    const res = await fetch(`${url}/rest/v1/${table}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": key, "Authorization": `Bearer ${key}`, "Prefer": "resolution=merge-duplicates" },
      body: JSON.stringify(data)
    });
    return res.ok;
  } catch { return false; }
}
async function supabaseGetAll(url, key, table, filter) {
  if (!url || !key) return null;
  try {
    const q = filter ? `?${filter}` : "";
    const res = await fetch(`${url}/rest/v1/${table}${q}`, {
      headers: { "apikey": key, "Authorization": `Bearer ${key}` }
    });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

// UUID simples
const uuid = () => "ch_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);

// ═══════════════════════════════════════════════════════════
// 1.1 — CONVERTER SUMÁRIO EM JSON TREE
// ═══════════════════════════════════════════════════════════
function sumarioToTree(text, projectId) {
  const lines = text.split("\n");
  const nodes = [];
  const numMap = {};

  for (const line of lines) {
    const t = line.trim();
    // Match "1", "1.1", "1.1.1" seguido de texto
    const m = t.match(/^(\d+(?:\.\d+)*)[.):\s]\s*([A-Za-záéíóúàâêîôûãõÁÉÍÓÚÀÂÊÎÔÛÃÕ][^.]{2,})(?:\.{2,}\d+)?$/);
    if (!m) continue;

    const num = m[1];
    const title = m[2].replace(/\.{2,}.*$/, "").trim();
    if (title.length < 3) continue;

    const parts = num.split(".");
    const level = parts.length;
    const parentNum = parts.length > 1 ? parts.slice(0, -1).join(".") : null;
    const parentId = parentNum ? numMap[parentNum] : null;
    const id = uuid();

    numMap[num] = id;
    nodes.push({
      id, num, title, level,
      parentNum, parentId,
      project_id: projectId,
      status: "pendente",   // pendente | em_andamento | concluido
      text: "",
      progresso: 0,
      jurisprudencia: "",
      doutrina: "",
      criado_em: new Date().toISOString(),
      atualizado_em: new Date().toISOString()
    });
  }

  // Fallback: tenta extrair capítulos com padrão "N|Título"
  if (nodes.length === 0) {
    const caps = [...text.matchAll(/```CAPITULOS\s*\n([\s\S]*?)```/gi)];
    if (caps[0]) {
      caps[0][1].split("\n").forEach((l, i) => {
        const m2 = l.trim().match(/^(\d+)\|(.+)/);
        if (!m2) return;
        const id = uuid();
        numMap[m2[1]] = id;
        nodes.push({ id, num: m2[1], title: m2[2].trim(), level: 1, parentNum: null, parentId: null, project_id: projectId, status: "pendente", text: "", progresso: 0, jurisprudencia: "", doutrina: "", criado_em: new Date().toISOString(), atualizado_em: new Date().toISOString() });
      });
    }
  }

  return nodes;
}

// 1.4 — PROGRESSO GRANULAR
// ═══════════════════════════════════════════════════════════
function calcChapterProgress(text) {
  if (!text || text.length < 50) return 0;
  if (text.length < 500) return 15;
  if (text.length < 2000) return 40;
  if (text.length < 5000) return 70;
  if (text.length < 10000) return 90;
  return 100;
}
function calcStatus(text) {
  const p = calcChapterProgress(text);
  if (p === 0) return "pendente";
  if (p < 70) return "em_andamento";
  return "concluido";
}
function calcProjectProgress(chapters) {
  const caps = chapters.filter(c => c.level === 1);
  if (!caps.length) return 0;
  return Math.round(caps.reduce((s, c) => s + calcChapterProgress(c.text), 0) / caps.length);
}

async function chamarClaude(messages,system,onStatus){
  const WAITS=[15,30,60];
  for(let t=0;t<=3;t++){
    if(t>0){for(let s=WAITS[t-1];s>0;s--){onStatus?.(`Aguardando ${s}s...`);await new Promise(r=>setTimeout(r,1000));}}
    onStatus?.(t===0?"⚖️ Claude Sonnet gerando...":"🔄 Tent."+(t+1)+"/4...");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:16000,system,messages})});
      if(res.status===529||res.status===503){if(t<3)continue;throw new Error("API sobrecarregada.");}
      if(res.status===429){for(let s=30;s>0;s--){onStatus?.(`Rate limit — ${s}s...`);await new Promise(r=>setTimeout(r,1000));}t--;continue;}
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`Erro ${res.status}: ${e?.error?.message||res.statusText}`);}
      const data=await res.json();
      const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
      if(text){onStatus?.("");return text;}if(t<3)continue;throw new Error("Resposta vazia.");
    }catch(e){if(t===3)throw e;}
  }
}
async function chamarGemini(messages,system,apiKey,onStatus){
  if(!apiKey?.trim())throw new Error("Cole a chave Gemini nas configurações.");
  const MODELS=["gemini-2.5-flash","gemini-2.5-flash-preview-05-20","gemini-2.0-flash"];
  for(const model of MODELS){
    try{
      onStatus?.(`🔮 ${model}...`);
      const contents=messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents,systemInstruction:{parts:[{text:system}]},generationConfig:{maxOutputTokens:8192,temperature:0.75}})});
      if(res.status===404)continue;
      if(!res.ok){const e=await res.json().catch(()=>({}));if(e?.error?.message?.includes("API_KEY"))throw new Error("Chave Gemini inválida.");continue;}
      const data=await res.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||"";
      if(text){onStatus?.("");return text;}
    }catch(e){if(e.message.includes("Failed to fetch"))throw new Error("Gemini bloqueado. Use Claude.");if(e.message.includes("inválida"))throw e;}
  }
  throw new Error("Nenhum modelo Gemini disponível. Use Claude.");
}

async function copiar(text){
  const c=text.replace(/\*\*([^*]+)\*\*/g,"$1").replace(/\*([^*]+)\*/g,"$1").replace(/\[Fonte:[^\]]+\]/g,"");
  try{await navigator.clipboard.writeText(c);return true;}catch{const ta=document.createElement("textarea");ta.value=c;Object.assign(ta.style,{position:"fixed",top:0,left:0,opacity:0,pointerEvents:"none"});document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");document.body.removeChild(ta);return true;}catch{document.body.removeChild(ta);return false;}}
}
function Linhas({text}){

function ProgressBar({pct, height=5, color="#22c55e", showLabel=false}) {
  return (
    <div style={{position:"relative"}}>
      <div style={{height,background:"#e5e0d8",borderRadius:3,overflow:"hidden"}}>

      </div>

// TREE NODE — nó da árvore de capítulos
// ═══════════════════════════════════════════════════════════
function TreeNode({node, children, currentId, onSelect, onGenerate, loading}) {
  const [open, setOpen] = useState(node.level < 2);
  const isActive = node.id === currentId;
  const pct = calcChapterProgress(node.text);
  const hasChildren = children && children.length > 0;

  return (
    <div style={{animation:"fadein .2s ease"}}>
      <div className="tree-node"
        style={{display:"flex",alignItems:"center",gap:5,padding:`5px ${8+node.level*12}px 5px 8px`,cursor:"pointer",borderLeft:isActive?`3px solid #c9a84c`:"3px solid transparent",background:isActive?"#fdfaf4":"transparent",transition:"all .12s"}}>
        {/* expand toggle */}
        <span onClick={()=>setOpen(o=>!o)} style={{fontSize:9,color:"#8a8278",flexShrink:0,width:12,textAlign:"center"}}>
          {hasChildren?(open?"▾":"▸"):"·"}
        </span>
        {/* status dot */}
        <span style={{fontSize:9,color:STATUS_COR[node.status]||"#d1d5db",flexShrink:0}}>{STATUS_IC[node.status]||"○"}</span>
        {/* title */}
        <span onClick={()=>onSelect(node)} style={{fontSize:node.level===1?11:10,fontWeight:node.level===1?700:400,color:isActive?"#0f1a33":"#444",flex:1,lineHeight:1.4,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {node.num} {node.title}
        </span>
        {/* progress mini */}
        {pct>0&&<span style={{fontSize:8,color:pct===100?"#166534":"#b45309",fontFamily:"monospace",flexShrink:0,fontWeight:700}}>{pct}%</span>}
        {/* gerar */}
        {node.level===1&&<button onClick={e=>{e.stopPropagation();onGenerate(node);}} disabled={loading}
          style={{fontSize:8,padding:"2px 5px",border:"1px solid #c9a84c",borderRadius:3,background:isActive?"#c9a84c":"white",color:isActive?"white":"#c9a84c",cursor:loading?"not-allowed":"pointer",flexShrink:0,opacity:loading?.4:1}}>▶</button>}
      </div>
      {/* mini progress bar for chapters */}
      {node.level===1&&pct>0&&(
        <div style={{marginLeft:37,marginRight:8,marginBottom:2}}>
          <ProgressBar pct={pct} height={2}/>
        </div>
      )}
      {/* children */}
      {open&&hasChildren&&<div>{children}</div>}
    </div>
  );
}

function buildTree(nodes, parentId=null, currentId, onSelect, onGenerate, loading) {
  return nodes.filter(n=>n.parentId===parentId).map(n=>(
    <TreeNode key={n.id} node={n} currentId={currentId} onSelect={onSelect} onGenerate={onGenerate} loading={loading}>
      {buildTree(nodes,n.id,currentId,onSelect,onGenerate,loading)}
    </TreeNode>
  ));
}

            <button key={m.id} onClick={()=>setMotor(m.id)}
              style={{padding:"4px 9px",border:"none",background:motor===m.id?G:"transparent",color:motor===m.id?N:"rgba(255,255,255,.6)",cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:motor===m.id?700:400}}>
              {m.l}
            </button>
          ))}
        </div>
        <button onClick={()=>setShowCfg(!showCfg)} style={{padding:"4px 9px",background:showCfg?G:"rgba(255,255,255,.08)",border:`1px solid ${showCfg?G:"rgba(255,255,255,.15)"}`,color:showCfg?N:"rgba(255,255,255,.7)",borderRadius:4,cursor:"pointer",fontSize:9,fontFamily:"monospace",fontWeight:700}}>⚙</button>
      </div>

      {/* ── CONFIG ── */}
      {showCfg&&(
        <div style={{background:"#07101e",borderBottom:"1px solid rgba(201,168,76,.2)",padding:"9px 16px",display:"flex",gap:10,alignItems:"flex-start",flexWrap:"wrap",flexShrink:0}}>
          {/* Gemini */}
          <div style={{minWidth:200,flex:1}}>
            <div style={{fontSize:8,color:G,fontFamily:"monospace",marginBottom:4,textTransform:"uppercase"}}>🔑 Gemini API Key</div>
            <div style={{display:"flex",gap:4}}>
              <input type={showK?"text":"password"} value={gemKey} onChange={e=>setGemKey(e.target.value)} placeholder="AIzaSy..."
                style={{flex:1,padding:"5px 8px",border:"1px solid rgba(201,168,76,.3)",borderRadius:3,background:"rgba(255,255,255,.07)",color:"white",fontFamily:"monospace",fontSize:10,outline:"none"}}/>
              <button onClick={()=>setShowK(!showK)} style={{padding:"4px 7px",background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.12)",color:"#ccc",borderRadius:3,cursor:"pointer",fontSize:10}}>{showK?"🙈":"👁"}</button>
            </div>
          </div>
          {/* Supabase */}
          <div style={{minWidth:220,flex:1}}>
            <div style={{fontSize:8,color:"#38bdf8",fontFamily:"monospace",marginBottom:4,textTransform:"uppercase"}}>☁ Supabase (opcional — sync em nuvem)</div>
            <input value={sbUrl} onChange={e=>setSbUrl(e.target.value)} placeholder="https://xxx.supabase.co"
              style={{width:"100%",padding:"5px 8px",border:"1px solid rgba(56,189,248,.3)",borderRadius:3,background:"rgba(255,255,255,.07)",color:"white",fontFamily:"monospace",fontSize:10,outline:"none",marginBottom:3}}/>
            <input type="password" value={sbKey} onChange={e=>setSbKey(e.target.value)} placeholder="anon public key..."
              style={{width:"100%",padding:"5px 8px",border:"1px solid rgba(56,189,248,.3)",borderRadius:3,background:"rgba(255,255,255,.07)",color:"white",fontFamily:"monospace",fontSize:10,outline:"none"}}/>
          </div>
          {/* SQL schema */}
          <div style={{minWidth:180}}>
            <div style={{fontSize:8,color:"#38bdf8",fontFamily:"monospace",marginBottom:4,textTransform:"uppercase"}}>SQL para criar tabelas no Supabase:</div>
            <button onClick={()=>copiar(`CREATE TABLE projects (id text PRIMARY KEY, nome text, area text, nivel text, autores text, contexto_juridico text, criado_em text, atualizado_em text);\nCREATE TABLE chapters (id text PRIMARY KEY, project_id text, num text, title text, level int, parent_id text, status text, text text, progresso int, jurisprudencia text, doutrina text, criado_em text, atualizado_em text);\nCREATE INDEX ON chapters(project_id);`)}
              style={{fontSize:8,padding:"4px 10px",border:"1px solid rgba(56,189,248,.3)",borderRadius:3,background:"rgba(56,189,248,.1)",color:"#38bdf8",cursor:"pointer",fontFamily:"monospace"}}>
              📋 Copiar SQL
            </button>
            <a href="https://supabase.com" target="_blank" rel="noreferrer" style={{display:"block",fontSize:8,color:"rgba(56,189,248,.6)",fontFamily:"monospace",marginTop:4,textDecoration:"none"}}>Criar conta Supabase gratuita ↗</a>
          </div>
          <button onClick={()=>setShowCfg(false)} style={{padding:"5px 10px",background:"rgba(34,197,94,.2)",border:"1px solid rgba(34,197,94,.4)",color:"#4ade80",borderRadius:4,cursor:"pointer",fontSize:9,fontFamily:"monospace",marginLeft:"auto",alignSelf:"flex-start"}}>✓ Salvar</button>
        </div>
      )}

      {/* ══ NAV ══ */}
      <div style={{background:"white",borderBottom:"2px solid #e5e0d8",display:"flex",alignItems:"stretch",flexShrink:0}}>
        {TABS.map(t=>(
          <button key={t.id} className="nt" onClick={()=>setTab(t.id)}
            style={{padding:"7px 14px",border:"none",borderBottom:`3px solid ${tab===t.id?G:"transparent"}`,background:tab===t.id?"#fdfaf4":"white",cursor:"pointer",fontSize:11,color:tab===t.id?N:"#8a8278",fontFamily:"Georgia,serif",fontWeight:tab===t.id?700:400,display:"flex",alignItems:"center",gap:4,marginBottom:-2}}>
            <span style={{fontSize:12}}>{t.ic}</span>{t.l}
          </button>
        ))}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,padding:"0 12px"}}>
          {/* Progresso do projeto */}
          {proj&&chapters.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:80}}><ProgressBar pct={projPct} height={4}/></div>
              <span style={{fontSize:8,fontFamily:"monospace",color:"#8a8278"}}>{projPct}% · {concluidos}✓ {emAndamento}◑</span>
            </div>
          )}
          <button onClick={novoProjeto} style={{fontSize:9,padding:"3px 9px",border:`1px solid ${G}`,borderRadius:3,background:"#fdfaf4",color:N,cursor:"pointer",fontFamily:"monospace",fontWeight:700}}>+ Projeto</button>
        </div>
      </div>

      {/* ══════════ INÍCIO ══════════ */}
      {tab==="inicio"&&(
        <div style={{flex:1,overflowY:"auto",padding:"14px 18px"}}>
          {/* KPIs */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:7,marginBottom:14}}>
            {[
              {l:"Projetos",  v:projList.length,       u:"no banco"},
              {l:"Capítulos", v:chapters.length,        u:"nesta obra"},
              {l:"Concluídos",v:concluidos,             u:`${chapters.filter(c=>c.level===1).length} totais`},
              {l:"Progresso", v:`${projPct}%`,          u:"do tratado"},
              {l:"Motor",     v:motor==="claude"?"Claude":"Gemini",u:motor==="claude"?"sem chave":"Google"},
            ].map((k,i)=>(
              <div key={i} style={{background:"white",border:"1px solid #e5e0d8",borderRadius:7,padding:"9px 11px"}}>
                <div style={{fontSize:7,color:"#8a8278",fontFamily:"monospace",marginBottom:3,textTransform:"uppercase",letterSpacing:".07em"}}>{k.l}</div>
                <div style={{fontSize:18,fontWeight:700,color:N,lineHeight:1}}>{k.v}</div>
                <div style={{fontSize:8,color:"#aaa",marginTop:2}}>{k.u}</div>
              </div>
            ))}
          </div>

          {/* Config rápida */}
          <div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:7,padding:"8px 12px",marginBottom:12,display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:7,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",whiteSpace:"nowrap"}}>Config:</span>
            <select style={inp} value={area} onChange={e=>setArea(e.target.value)}>{AREAS.map(a=><option key={a}>{a}</option>)}</select>
            <select style={inp} value={nivel} onChange={e=>setNivel(e.target.value)}>
              <option value="Doutorado e tratados acadêmicos">Doutorado / Tratado</option>
              <option value="Operadores do Direito">Operadores do Direito</option>
              <option value="Mestrado e pós-graduação">Mestrado / Pós-Grad.</option>
              <option value="Graduação avançada">Graduação Avançada</option>
            </select>
          </div>

          {/* Lista de projetos */}
          {projList.length>1&&(
            <div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:7,padding:"10px 13px",marginBottom:12}}>
              <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",marginBottom:8}}>Projetos salvos</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {projList.map(p=>(
                  <button key={p.id} onClick={()=>carregarProjeto(p)}
                    style={{padding:"5px 12px",border:`1px solid ${proj?.id===p.id?G:"#d4cfc6"}`,borderRadius:4,background:proj?.id===p.id?"#fdfaf4":"white",color:proj?.id===p.id?N:"#666",cursor:"pointer",fontSize:10,fontFamily:"Georgia,serif",fontWeight:proj?.id===p.id?700:400}}>
                    {p.nome?.slice(0,30)||"Sem título"}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Árvore de capítulos — sumário visual */}
          {chapters.length>0?(
            <div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:7,padding:"10px 0",marginBottom:12}}>
              <div style={{padding:"0 13px 8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em"}}>📋 Estrutura do tratado — {chapters.length} nós</div>
                <div style={{display:"flex",gap:8"}}>
                  {[["○","pendente","#d1d5db"],["◑","em andamento","#fbbf24"],["●","concluído","#22c55e"]].map(([ic,l,cor])=>(
                    <span key={l} style={{fontSize:8,color:cor,fontFamily:"monospace"}}>{ic} {l}</span>
                  ))}
                </div>
              </div>
              <div style={{maxHeight:320,overflowY:"auto"}}>
                {buildTree(chapters,null,currentCh?.id,selecionarCapitulo,gerarCapitulo,edLoading)}
              </div>
            </div>
          ):(
            <div style={{background:"white",border:`1px solid ${G}40`,borderRadius:8,padding:"20px",textAlign:"center",marginBottom:12}}>
              <div style={{fontSize:32,marginBottom:8}}>📋</div>
              <div style={{fontSize:12,fontWeight:700,color:N,marginBottom:6}}>Nenhum sumário ainda</div>
              <div style={{fontSize:10,color:"#8a8278",lineHeight:1.7,marginBottom:12}}>Vá à aba <strong>Sumário</strong>, gere a estrutura completa do tratado e importe para o banco. Os capítulos aparecerão aqui como árvore interativa com botões de geração.</div>
              <button onClick={()=>setTab("sumario")} style={{padding:"8px 18px",background:N,color:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>📋 Gerar Sumário →</button>
            </div>
          )}
        </div>
      )}

      {/* ══════════ SUMÁRIO ══════════ */}
      {tab==="sumario"&&(
        <div style={{flex:1,display:"flex",overflow:"hidden"}}>
          {/* Formulário */}
          <div style={{width:300,flexShrink:0,overflowY:"auto",padding:"14px 16px",borderRight:"1px solid #e5e0d8",background:"white"}}>
            <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em",marginBottom:11}}>📋 Gerador · JSON Tree · Banco</div>
            <div style={{marginBottom:10}}>
              <label style={lblSty}>📖 Título da obra *</label>
              <input value={sumTitulo} onChange={e=>setSumTitulo(e.target.value)} placeholder="Ex: Direito Administrativo Contemporâneo" style={inpSty} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
            </div>
            <div style={{marginBottom:10}}>
              <label style={lblSty}>📝 Contexto / escopo da obra</label>
              <textarea value={sumDesc} onChange={e=>setSumDesc(e.target.value)} rows={4} placeholder="Problema jurídico central, abordagem, público-alvo..."
                style={{...inpSty,resize:"none",lineHeight:1.65}} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
            </div>
            <button onClick={gerarSumario} disabled={!sumTitulo||sumLoading==="Gerando..."}
              style={{width:"100%",padding:"9px",background:N,color:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700,marginBottom:8}}>
              {sumLoading==="Gerando..."?"⏳ Gerando...":"📋 Gerar Sumário"}
            </button>
            {sumLoading&&<div style={{fontSize:9,padding:"6px 9px",borderRadius:4,background:sumLoading.startsWith("✅")?"#f0fdf4":sumLoading.startsWith("⚠")?"#fef2f2":"#eff6ff",color:sumLoading.startsWith("✅")?"#166534":sumLoading.startsWith("⚠")?"#991b1b":"#1d4ed8",fontFamily:"monospace",lineHeight:1.5,marginBottom:8}}>{sumLoading}</div>}
            {sumTexto&&!sumLoading&&(
              <button onClick={()=>integrarSumario(sumTexto,sumTitulo)}
                style={{width:"100%",padding:"9px",background:"#166534",color:"white",border:"none",borderRadius:5,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>
                🔗 Importar para banco + JSON Tree
              </button>
            )}
            {/* Legenda */}
            {chapters.length>0&&(
              <div style={{marginTop:14,borderTop:"1px solid #e5e0d8",paddingTop:10}}>
                <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",marginBottom:7}}>Estrutura atual — {chapters.length} nós</div>
                <div style={{fontSize:9,fontFamily:"monospace",color:"#666",lineHeight:1.7}}>
                  • Cap. nível 1: {chapters.filter(c=>c.level===1).length}<br/>
                  • Seções nível 2: {chapters.filter(c=>c.level===2).length}<br/>
                  • Subseções nível 3+: {chapters.filter(c=>c.level>=3).length}<br/>
                  • ✅ Concluídos: {concluidos}<br/>
                  • ◑ Em andamento: {emAndamento}
                </div>
                <div style={{marginTop:8}}><ProgressBar pct={projPct} height={5} showLabel/></div>
              </div>
            )}
          </div>
          {/* Resultado */}
          <div style={{flex:1,overflowY:"auto",padding:"14px 18px",background:"#fdfaf4"}}>
            {!sumTexto?(
              <div style={{textAlign:"center",padding:"50px 18px",color:"#8a8278"}}>
                <div style={{fontSize:46,marginBottom:10}}>🌳</div>
                <div style={{fontSize:12,color:N,fontWeight:700,marginBottom:6}}>Sumário → JSON Tree → Banco de dados</div>
                <div style={{fontSize:10,lineHeight:1.8,maxWidth:380,margin:"0 auto"}}>
                  <strong>1.</strong> Preencha o título e gere o sumário.<br/>
                  <strong>2.</strong> Clique em "Importar para banco" — cada título vira um nó JSON com id, num, title, level, parentId, status, progresso.<br/>
                  <strong>3.</strong> Os capítulos aparecem na aba Início como árvore interativa.<br/>
                  <strong>4.</strong> Clique em ▶ para gerar qualquer capítulo — texto salvo automaticamente no IndexedDB{sbUrl?" + Supabase":""}.
                </div>
              </div>
            ):(
              <div>
                <div style={{display:"flex",gap:6,marginBottom:11,flexWrap:"wrap"}}>
                  <button onClick={()=>hCopy(sumTexto,"s")} style={bOut(cpFb["s"]?"#22c55e":"#d4cfc6",cpFb["s"]?"#166534":"#555")}>{cpFb["s"]?"✓ Copiado!":"📋 Copiar"}</button>
                  <button onClick={()=>setSumTexto("")} style={bOut()}>🔄 Novo</button>
                </div>
                <pre style={{whiteSpace:"pre-wrap",fontFamily:"Georgia,serif",fontSize:12,lineHeight:1.9,color:"#0f0e0c"}}>{sumTexto}</pre>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ══════════ EDITOR DE CAPÍTULO ══════════ */}
      {tab==="editor"&&(
        <div style={{flex:1,display:"flex",overflow:"hidden"}}>
          {/* Painel esquerdo — árvore */}
          <div style={{width:240,flexShrink:0,overflowY:"auto",borderRight:"1px solid #e5e0d8",background:"white"}}>
            <div style={{padding:"8px 12px",borderBottom:"1px solid #e5e0d8",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".1em"}}>Capítulos</span>
              <span style={{fontSize:8,fontFamily:"monospace",color:projPct===100?"#166534":"#b45309"}}>{projPct}%</span>
            </div>
            {chapters.length>0
              ?<div style={{padding:"4px 0"}}>{buildTree(chapters,null,currentCh?.id,selecionarCapitulo,gerarCapitulo,edLoading)}</div>
              :<div style={{padding:"14px",fontSize:9,color:"#aaa",textAlign:"center",fontFamily:"monospace"}}>Gere um sumário primeiro.</div>
            }
          </div>

          {/* Painel direito — editor */}
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {!currentCh?(
              <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10,color:"#8a8278",padding:"30px"}}>
                <div style={{fontSize:40}}>✍️</div>
                <div style={{fontSize:12,color:N,fontWeight:700}}>Selecione um capítulo na árvore</div>
                <div style={{fontSize:10,lineHeight:1.7,maxWidth:340,textAlign:"center"}}>Clique em qualquer capítulo à esquerda para editar ou clique em ▶ para gerar o texto com IA.</div>
              </div>
            ):(
              <>
                {/* Cabeçalho do capítulo */}
                <div style={{background:"white",borderBottom:"1px solid #e5e0d8",padding:"8px 14px",flexShrink:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                    <div style={{fontSize:12,fontWeight:700,color:N}}>{currentCh.num} — {currentCh.title}</div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <span style={{fontSize:8,padding:"2px 7px",borderRadius:10,background:`${STATUS_COR[currentCh.status]}20`,color:STATUS_COR[currentCh.status],fontFamily:"monospace",fontWeight:700}}>{currentCh.status}</span>
                      <button onClick={()=>saveChapter(true)} style={{fontSize:9,padding:"3px 9px",border:"1px solid #22c55e",borderRadius:3,background:"white",color:"#166534",cursor:"pointer",fontFamily:"monospace",fontWeight:700}}>💾 Salvar</button>
                      <button onClick={()=>gerarCapitulo(currentCh)} disabled={edLoading} style={{fontSize:9,padding:"3px 9px",border:`1px solid ${G}`,borderRadius:3,background:"#fdfaf4",color:N,cursor:edLoading?"not-allowed":"pointer",fontFamily:"monospace",fontWeight:700,opacity:edLoading?.5:1}}>▶ Gerar</button>
                    </div>
                  </div>
                  <ProgressBar pct={calcChapterProgress(chText)} height={4} showLabel/>
                </div>

                {/* Status IA */}
                {(edLoading||edStatus)&&<div style={{padding:"7px 14px",background:edStatus.startsWith("⚠")?"#fef2f2":"#eff6ff",borderBottom:"1px solid #e5e0d8",fontSize:9,fontFamily:"monospace",color:edStatus.startsWith("⚠")?"#991b1b":"#1d4ed8",display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                  {edLoading&&<div style={{width:8,height:8,borderRadius:"50%",border:`2px solid ${G}`,borderTopColor:"transparent",animation:"spin 1s linear infinite"}}/>}
                  {edStatus||"Gerando texto jurídico..."}
                </div>}

                {/* Tabs: Texto | Jurisprudência | Doutrina */}
                <div style={{background:"white",borderBottom:"1px solid #e5e0d8",display:"flex",flexShrink:0}}>
                  {[{k:"texto",l:"📄 Texto"},
                    {k:"juri",l:"⚖️ Jurisprudência"},
                    {k:"dout",l:"📚 Doutrina"},
                    {k:"prob",l:"📌 Problema"}].map(t=>{
                    const [subTab,setSubTab_] = useState("texto");
                    return null; // handled below
                  })}
                </div>

                {/* Editor principal */}
                <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
                  <div style={{flex:1,overflowY:"auto",padding:"10px 14px"}}>
                    <textarea value={chText} onChange={e=>setChText(e.target.value)}
                      placeholder="Texto do capítulo — gerado pela IA ou editado manualmente. Salvo automaticamente a cada 30s."
                      style={{width:"100%",height:"100%",minHeight:300,padding:"10px 12px",border:"1px solid #d4cfc6",fontFamily:"Georgia,serif",fontSize:13,resize:"none",outline:"none",borderRadius:4,lineHeight:1.9,background:CR}}
                      onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
                  </div>
                  {/* Ações */}
                  <div style={{background:"white",borderTop:"1px solid #e5e0d8",padding:"8px 14px",display:"flex",gap:6,flexShrink:0,flexWrap:"wrap"}}>
                    <button onClick={()=>gerarDocx(chText,proj?.nome||"",proj||{})} style={{padding:"4px 12px",background:"#8b1a1a",color:"white",border:"none",borderRadius:3,fontSize:10,fontFamily:"monospace",cursor:"pointer",fontWeight:700}}>⬇ .docx</button>
                    <button onClick={()=>hCopy(chText,"ct")} style={bOut(cpFb["ct"]?"#22c55e":"#d4cfc6",cpFb["ct"]?"#166534":"#555")}>{cpFb["ct"]?"✓ Copiado!":"📋 Copiar"}</button>
                    <button onClick={async()=>{
                      const txt=chText;
                      const prompt=`Continue EXATAMENTE de onde parou, sem repetir nada:\n\n${txt.slice(-300)}`;
                      setEdLoading(true);
                      try{const r=await(motor==="gemini"?chamarGemini:chamarClaude)([{role:"user",content:prompt}],buildSys(area,nivel,proj||{}),motor==="gemini"?gemKey:undefined,setEdStatus);setChText(t=>t+"\n\n"+r);}catch(e){setEdStatus("⚠️ "+e.message);}
                      setEdLoading(false);
                    }} disabled={edLoading} style={bOut()}>▶ Continuar</button>
                    <button onClick={async()=>{
                      setEdLoading(true);
                      try{const r=await(motor==="gemini"?chamarGemini:chamarClaude)([{role:"user",content:`Revise e aprimore preservando estilo, corrija ABNT:\n\n${chText}`}],buildSys(area,nivel,proj||{}),motor==="gemini"?gemKey:undefined,setEdStatus);setChText(r);}catch(e){setEdStatus("⚠️ "+e.message);}
                      setEdLoading(false);
                    }} disabled={edLoading} style={bOut()}>🔍 Revisar</button>
                    {/* Jurisprudência */}
                    <div style={{marginLeft:"auto",display:"flex",gap:6}}>
                      <textarea value={chJuri} onChange={e=>setChJuri(e.target.value)} placeholder="Jurisprudência coletada para este cap..."
                        style={{width:160,height:32,padding:"4px 8px",border:"1px solid #d4cfc6",fontFamily:"monospace",fontSize:9,resize:"none",outline:"none",borderRadius:3,background:"#f9f6f2"}}/>
                      <textarea value={chDout} onChange={e=>setChDout(e.target.value)} placeholder="Doutrina / referências..."
                        style={{width:160,height:32,padding:"4px 8px",border:"1px solid #d4cfc6",fontFamily:"monospace",fontSize:9,resize:"none",outline:"none",borderRadius:3,background:"#f9f6f2"}}/>
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ══════════ BUSCA ══════════ */}
      {tab==="busca"&&(
        <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
          <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".12em",marginBottom:12}}>
            Busca jurídica — STF · STJ · TCU · TRFs · BDjur · LexML
          </div>
          {/* Tribunais diretos */}
          {[
            {l:"STF",      url:"https://jurisprudencia.stf.jus.br/pages/search?base=acordaos&query="},
            {l:"STJ",      url:"https://scon.stj.jus.br/SCON/pesquisar.jsp?q="},
            {l:"TCU",      url:"https://pesquisa.apps.tcu.gov.br/resultado/jurisprudencia/"},
            {l:"TRF1",     url:"https://portal.trf1.jus.br/portaltrf1/jurisprudencia/pesquisar-jurisprudencia.htm?q="},
            {l:"TRF2",     url:"https://www10.trf2.jus.br/portal/?q="},
            {l:"TRF3",     url:"https://web.trf3.jus.br/base-textual/Home/ListaDecisao/1?np=0&q="},
            {l:"TRF4",     url:"https://jurisprudencia.trf4.jus.br/pesquisa/pesquisa.php?tipo=1&q="},
            {l:"TRF5",     url:"https://www4.trf5.jus.br/Jurisprudencia/?q="},
            {l:"BDjur",    url:"https://bdjur.stj.jus.br/jspui/simple-search?query="},
            {l:"LexML",    url:"https://www.lexml.gov.br/busca/find?query="},
            {l:"Planalto", url:"https://www.planalto.gov.br/busca/?q="},
          ].reduce((acc,t,i)=>{ if(i%6===0)acc.push([]); acc[acc.length-1].push(t); return acc; },[]).map((row,ri)=>(
            <div key={ri} style={{display:"flex",gap:5,marginBottom:6,flexWrap:"wrap"}}>
              {row.map(t=>{
                const [q,setQ]=useState("");
                return null; // handled via shared state below
              })}
            </div>
          ))}
          {/* Busca unificada com IA */}
          {(()=>{
            const [bq,setBq]=useState("");
            const [br,setBr]=useState("");
            const [bl,setBl]=useState(false);
            async function buscar(){
              if(!bq||bl)return;
              setBl(true);setBr("");
              try{const r=await(motor==="gemini"?chamarGemini:chamarClaude)([{role:"user",content:`Pesquise jurisprudência STF/STJ (2020-2025) sobre: ${bq}\nMínimo 5 precedentes: número, relator, turma, data, ementa, tese.`}],buildSys(area,nivel,proj||{}),motor==="gemini"?gemKey:undefined,()=>{});setBr(r);}catch(e){setBr("⚠️ "+e.message);}
              setBl(false);
            }
            return (
              <div>
                <div style={{display:"flex",gap:7,marginBottom:10}}>
                  <input value={bq} onChange={e=>setBq(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")buscar();}}
                    placeholder="Tema para busca..." style={{flex:1,padding:"9px 12px",border:"1px solid #d4cfc6",fontFamily:"Georgia,serif",fontSize:12.5,borderRadius:4,outline:"none",background:"white"}} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
                  <button onClick={buscar} disabled={bl||!bq} style={{padding:"9px 14px",background:bl||!bq?"#d4cfc6":N,color:"white",border:"none",borderRadius:4,cursor:bl||!bq?"not-allowed":"pointer",fontSize:10,fontFamily:"monospace",fontWeight:700}}>{bl?"⏳...":"🔎 IA"}</button>
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
                  {[{l:"STF",u:"https://jurisprudencia.stf.jus.br/pages/search?base=acordaos&query="},{l:"STJ",u:"https://scon.stj.jus.br/SCON/pesquisar.jsp?q="},{l:"TCU",u:"https://pesquisa.apps.tcu.gov.br/resultado/jurisprudencia/"},{l:"TRF1",u:"https://portal.trf1.jus.br/portaltrf1/jurisprudencia/pesquisar-jurisprudencia.htm?q="},{l:"TRF2",u:"https://www10.trf2.jus.br/portal/?q="},{l:"TRF3",u:"https://web.trf3.jus.br/base-textual/Home/ListaDecisao/1?np=0&q="},{l:"TRF4",u:"https://jurisprudencia.trf4.jus.br/pesquisa/pesquisa.php?tipo=1&q="},{l:"TRF5",u:"https://www4.trf5.jus.br/Jurisprudencia/?q="},{l:"BDjur",u:"https://bdjur.stj.jus.br/jspui/simple-search?query="},{l:"LexML",u:"https://www.lexml.gov.br/busca/find?query="},{l:"Planalto",u:"https://www.planalto.gov.br/busca/?q="}].map(t=>(
                    <button key={t.l} className="tb" onClick={()=>bq&&window.open(t.u+encodeURIComponent(bq),"_blank")} disabled={!bq}
                      style={{padding:"4px 10px",border:"1px solid #0f1a33",borderRadius:3,background:"white",color:"#0f1a33",cursor:bq?"pointer":"not-allowed",fontSize:9,fontFamily:"monospace",fontWeight:700,opacity:bq?1:.3}}>
                      🔗 {t.l}
                    </button>
                  ))}
                </div>
                {br&&<div style={{background:"white",border:"1px solid rgba(201,168,76,.4)",borderLeft:"3px solid #c9a84c",borderRadius:4,padding:"12px 16px"}}>
                  <div style={{fontSize:13,lineHeight:1.9,fontFamily:"Georgia,serif"}}><Linhas text={br}/></div>
                  <div style={{display:"flex",gap:5,marginTop:10}}>
                    <button onClick={()=>copiar(br)} style={bOut()}>📋 Copiar</button>
                    <button onClick={()=>{if(currentCh)setChJuri(j=>j+(j?"\n\n":"")+br);else alert("Selecione um capítulo primeiro.");setTab("editor");}} style={{padding:"4px 12px",background:N,color:"white",border:"none",borderRadius:3,fontSize:10,fontFamily:"monospace",cursor:"pointer",fontWeight:700}}>→ Salvar no capítulo</button>
                  </div>
                </div>}
              </div>
            );
          })()}
        </div>
      )}

      {/* ══════════ PROJETO ══════════ */}
      {tab==="projeto"&&(
        <div style={{flex:1,overflowY:"auto",padding:"14px 18px"}}>
          <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",textTransform:"uppercase",letterSpacing:".12em",marginBottom:12}}>Configuração do projeto</div>
          {proj?(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                {[{l:"📖 Nome da obra",k:"nome",ph:"Ex: Direito Administrativo Contemporâneo"},{l:"🏛 Área do Direito",k:"area",ph:"Ex: Direito Administrativo"}].map(f=>(
                  <div key={f.k}>
                    <label style={lblSty}>{f.l}</label>
                    <input value={proj[f.k]||""} onChange={e=>setProj(p=>({...p,[f.k]:e.target.value}))} placeholder={f.ph} style={inpSty} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
                  </div>
                ))}
              </div>
              <div style={{marginBottom:10}}>
                <label style={lblSty}>✍️ Autores / referência de estilo</label>
                <input value={proj.autores||""} onChange={e=>setProj(p=>({...p,autores:e.target.value}))} placeholder="Ex: Di Pietro, Marinoni, Celso Antônio Bandeira de Mello..." style={inpSty} onFocus={e=>e.target.style.borderColor=G} onBlur={e=>e.target.style.borderColor="#d4cfc6"}/>
              </div>
              {/* 1.6 — Contexto Jurídico Injetável */}
              <div style={{marginBottom:14}}>
                <label style={lblSty}>
                  📌 Contexto Jurídico Global
                  <span style={{fontWeight:400,color:"#8a8278",marginLeft:6,fontSize:9}}>(injetado automaticamente em TODOS os prompts — Item 1.6)</span>
                </label>
                <textarea value={proj.contexto_juridico||""} onChange={e=>setProj(p=>({...p,contexto_juridico:e.target.value}))} rows={5}
                  placeholder="Descreva o problema jurídico central do projeto, o contexto doutrinário, questões-chave, abordagem metodológica... Tudo que for inserido aqui será automaticamente incluído em cada prompt de geração, garantindo coerência e direcionamento ao longo de toda a obra."
                  style={{...inpSty,resize:"vertical",lineHeight:1.7,background:"#fdfaf4",border:`1px solid ${G}40`}}
                  onFocus={e=>{e.target.style.borderColor=G;e.target.style.background="white";}} onBlur={e=>{e.target.style.borderColor=`${G}40`;e.target.style.background="#fdfaf4";}}/>
                <div style={{fontSize:8,color:"#8a8278",fontFamily:"monospace",marginTop:3}}>Este campo é a variável global injetável — a "âncora doutrinária" de toda a obra.</div>
              </div>

              {/* Progresso granular por capítulo */}
              {chapters.filter(c=>c.level===1).length>0&&(
                <div style={{background:"white",border:"1px solid #e5e0d8",borderRadius:7,padding:"11px 14px",marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                    <span style={{fontSize:9,fontFamily:"monospace",color:N,fontWeight:700}}>Progresso granular por capítulo</span>
                    <span style={{fontSize:9,fontFamily:"monospace",color:G,fontWeight:700}}>{projPct}% do tratado</span>
                  </div>
                  <ProgressBar pct={projPct} height={6} showLabel/>
                  <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:6}}>
                    {chapters.filter(c=>c.level===1).map(c=>{
                      const p=calcChapterProgress(c.text);
                      return (
                        <div key={c.id}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
                            <span style={{fontSize:9,color:N,fontFamily:"monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"75%"}}>{c.num} — {c.title}</span>
                            <span style={{fontSize:8,color:STATUS_COR[c.status],fontFamily:"monospace",fontWeight:700,flexShrink:0}}>{STATUS_IC[c.status]} {p}%</span>
                          </div>
                          <ProgressBar pct={p} height={3}/>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                <button onClick={()=>salvarProjeto(proj)} style={{padding:"7px 16px",background:N,color:G,border:`1px solid ${G}`,borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>💾 Salvar projeto</button>
                <button onClick={()=>setTab("sumario")} style={{padding:"7px 14px",background:"white",color:N,border:`1px solid ${N}`,borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>📋 Ir ao Sumário</button>
                <button onClick={async()=>{
                  if(!window.confirm("Exportar toda a obra em .docx?"))return;
                  const texto=chapters.filter(c=>c.level===1).map(c=>c.text).filter(Boolean).join("\n\n---\n\n");
                  if(!texto){alert("Nenhum texto gerado ainda.");return;}
                  gerarDocx(texto,proj.nome||"Obra",proj);
                }} style={{padding:"7px 14px",background:"#8b1a1a",color:"white",border:"none",borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace",fontWeight:700}}>⬇ Exportar obra completa .docx</button>
                {sbUrl&&sbKey&&<button onClick={async()=>{
                  const ps=await supabaseGetAll(sbUrl,sbKey,"chapters",`project_id=eq.${proj.id}&order=num`);
                  if(ps){setChapters(ps);alert(`✅ ${ps.length} capítulos sincronizados do Supabase.`);}else{alert("⚠️ Falha na sincronização.");}
                }} style={{padding:"7px 14px",background:"#0369a1",color:"white",border:"none",borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>☁ Sync Supabase</button>}
                <button onClick={()=>{if(window.confirm("Excluir este projeto e seus capítulos?")){}}} style={{padding:"7px 12px",background:"white",color:"#b91c1c",border:"1px solid #fca5a5",borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"monospace"}}>🗑 Excluir</button>
              </div>
            </div>
          ):(
            <div style={{textAlign:"center",padding:"30px",color:"#8a8278"}}>
              <div style={{fontSize:32,marginBottom:8}}>📚</div>
              <div style={{fontSize:12,color:N,fontWeight:700,marginBottom:6}}>Nenhum projeto ativo</div>
              <button onClick={novoProjeto} style={{padding:"9px 18px",background:N,color:G,border:`1px solid ${G}`,borderRadius:5,cursor:"pointer",fontSize:12,fontFamily:"monospace",fontWeight:700}}>+ Criar primeiro projeto</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
